  sees: each network's tier; limit overrides (key, value, a reason citing an ops change or §21 case); quota state (stored bytes, storage_over, spent time); daily usage per network and meter (edge leases, evs transfer, relayed bytes, seats, the Team overages, and the transfer overage's helper rows team_credit_window and team_credit_running, which GET /network/usage hides; §20.9); debit journal rows (usage, balance, meter, bytes, batch, applied); usage batches (batch id, producer, window start, applied time); Stripe meter reports (network, meter, day, identifier, value, state, version, attempts, next send); each Team's Stripe subscription and customer ids, billing anchor, start and end (owner decision 199); rate counters, among them each erasing sidecar's closure bytes for the day (owner decision 146); every connected sidecar client, each admitted marked client scored by its expiry ms, counted and added at connect by one script under the limit and refreshed on the resident poll, counted by one ZCOUNT from now at enrollment ({sq_<network_id>}connected_sidecar); each network's network_verified as 0 or 1 ({sq_<network_id>}verified); edge leases (network, meter, reservations of 64 MiB to 1 GiB, 16 to 256 MiB on Community); per relayed contract its reservation, grant and settled bytes; each balance's lowest credit shown in the last 2 min
