evs-1:
  service: evs; gkm reads it
  store: repo/<repo> (metadata cluster)
  sees: repo_id; kind (general, record, config, team_record, mailcfg, vault, mailbox, secret; directory, one per team network; agents, one a member, and agent, one an agent, DESIGN-COMPUTE §20.4; listeners, one a network, §26.6); owner member of an owner-bound kind; state (keying, active, deleted, shredding, shredded, each with time, signer and deletion id); object format (1, or 2 from a repo's first push carrying a format-2 value, such as a versionless file or a DROP; §11.6); sealed display name; its network, from the projection, stored at creation and never changed, kept in the shredded tombstone (§11.12)
