    spdx: MIT
    reason: through gnark, for smtpproof's prover (§14)
    leg: [engine, cli, test]
  - module: github.com/cloudflare/circl
    spdx: BSD-3-Clause
    reason: through go-crypto, in go-git's commit signature checks, which mlsinterop's oracle links and never calls
    leg: [test]
  - module: github.com/consensys/gnark
    spdx: Apache-2.0 AND MIT
    reason: the proof system of smtpproof's prover and verifier (§14), which server and cli inject; its frontend/schema links reflectwalk under MIT
    leg: [engine, cli, test]
  - module: github.com/consensys/gnark-crypto
    spdx: Apache-2.0
    reason: gnark's curves and hashes, for smtpproof (§14)
    leg: [engine, cli, test]
