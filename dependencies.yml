# Every module a leg of this repository links, with its SPDX id, why it is here and the legs that
# may link it: client, engine, cli, test (§4.7). make check fails a leg linking a module not listed
# here, or linking it on a leg its row does not name, and reads each id against the module's own
# license files: those at its top, and those beside or above a package a leg links. This
# repository's own modules are not listed.
#
# Allowed: MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, MPL-2.0, and X11, which is MIT's text
# plus only its no-advertising clause (QD-240). Ids joined by AND are a module whose files carry
# several of them. Refused: the GPL family, SSPL, BUSL, custom, unlicensed. A license outside the
# list stops make check.
#
# planned: true marks a module nothing links yet, because §4.7 names it for later or a track has it in
# flight. Its id was read from its files at the version §4.7, a sibling go.mod or that track gives.
# Drop the field in the change that links it, which make check says when it sees one linked.
#
# Keep the file to this shape: check/deps_test.go reads it line by line and fails on anything else.

modules:
  - module: github.com/andybalholm/brotli
    spdx: MIT
    reason: through utls, for TLS certificate compression in connect's fingerprinted dials
    leg: [client, engine, cli, test]
  - module: github.com/bits-and-blooms/bitset
    spdx: BSD-3-Clause
    reason: through gnark, for smtpproof's prover (§14)
    leg: [engine, cli, test]
