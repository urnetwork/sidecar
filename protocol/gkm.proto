// §10's wire: the clear header of every commit, the MLS credential, and the ladder and delivery records gkm
// stores, as §10.4 and §10.5 write them. No field is removed once M2's entry review fixes it, and they freeze
// at M2's exit on §22.10's 0x0010 interop artifact (D-KEYS-10). A bare section number, as in 10.5, is DESIGN.md's.
//
// ReaderKey and GkmHint, which §10 writes as field lists, and GroupForm, which only §2.8's gkm-1 lists, come next.
// They take numbers in the order written, and stay open to review until that entry review.
//
// Last come what §10 names and gives no bytes, which that review also settles: the bodies of §10.6's objects, then
// of §10.14's routes. Each route body is one of these messages, or a Signed, as application/octet-stream, as
// PollResponse is, with no service block (§4.7). An object or route that holds only a Signed, a KeyPackage, a
// Welcome or a RecoveryWrap's ciphertext holds those bytes bare and has no message here. Every field names the §2.8
// row that shows it in testdata/gkm/metadata_rows.yml (I-18), which also marks the few a row does not yet say.

syntax = "proto3";
package urnetwork.sidecar;

import "protocol/bridge/auth.proto";
import "protocol/bridge/signed.proto";

option go_package = "github.com/urnetwork/sidecar/protocol";

message GkmCommitHeader {   // sidecar/protocol/gkm.proto, in authenticated_data of every commit
  uint64  generation = 1;   // the generation of this epoch's GenWrap: the newest gen/ the committer holds;
                            //   0 only for a recovery self-join that carries no GenWrap (10.6's epoch PUT, 10.8)
  AuthPin auth = 2;         // the state (§7.9) the new roster was checked against
}

message UrMlsCredential {                         // sidecar/protocol/gkm.proto
  bytes sidecar_id = 1;                           // durable leaf identity (§5)
  bytes identity_public_key = 2; string identity_alg = 3;  // §5; ed25519 in v0
  bytes mls_signature_public_key = 4;             // rotated by self-update
  uint32 cipher_suite = 5; int64 not_after = 6;   // 0x0010 (owner decision 44)
  bytes admission_sha256 = 7;                     // its §7.9 SidecarAdmit; Genesis for the first device
  bytes identity_signature = 8;                   // §6 signing, purpose mls-credential, fields 1-7
}

message GenRotate {              // sidecar/protocol/gkm.proto; §6 Signed, purpose gen-rotate, by the rotator's identity key
  bytes   group_id = 1; bytes repo_id = 2;
  uint64  generation = 3;        // g; generation 1 is written with epoch 0 (KF1) and has no parent
  bytes   parent_commitment = 4; // C_{g-1}
  bytes   commitment = 5;        // C_g
  uint32  cause = 6;             // 1 REMOVE, 2 REQUEST, 3 SCHEDULE; REMOVE iff it covers a shrink, an
                                 //   authorization expiry or a compromise retirement since the parent (10.9)
  AuthPin auth = 7;              // the state KeyHolders was computed at (§7.9); never below the previous
                                 //   base or the parent's auth
  int64   time_ms = 8;           // the evaluation time for expiries; within 10 min of gkm's clock
  bytes   holders_sha256 = 9;    // SHA-256 over the sorted KeyHolders(R, auth, time) identities (below)
  uint32  wrap_count = 10;       // staged wraps and recovery wraps, for completeness checks
  bytes   genlink = 11;          // GenLink_g
  LeafWrap leaf_wrap = 12;       // optional: one wrap for every leaf of that epoch, 72 B
  bytes   drop_public_key = 13;  // only for kinds that take deposits (D-KEYS-17)
  int64   drop_not_after_ms = 14;
}
message LeafWrap { uint64 epoch = 1; bytes ciphertext = 2; }  // RK_g under KEK_epoch, aad group_id||epoch||g
message KeyDelivery {              // the body of a ReaderWrap or DelegationWrap, gkm's wrap/ object (10.6)
  bytes   group_id = 1;
  uint64  generation = 2;          // g
  bytes   commitment = 3;          // C_g, all 32 bytes
  bytes   recipient = 4;           // sidecar_id; a DelegationWrap's, the delegation_id
  bytes   recipient_key_sha256 = 5;  // SHA-256 of the X-Wing public key sealed to: a ReaderKey's, which a
                                     //   replacement changes, or the Delegation's reader_xwing_public_key
  uint32  delivery_kind = 6;       // 1 STAGED: by gen/<g>'s rotator before its claim; 2 LATE: after it (10.9)
  AuthPin auth = 7;                // LATE only: the signer's newest verified state when it signs
  int64   time_ms = 8;             // LATE only: the signer's clock or, if later, gen/<g>'s time_ms; within 10 min of gkm's
  bytes   ciphertext = 9;          // HPKE-XWing(that key, RK_g), info "UR evs 1.0 wrap", aad wrap_aad
}
message ReaderWrap { KeyDelivery wrap = 1; }      // §6 Signed, purpose reader-wrap, by the signer's identity key
message DelegationWrap { KeyDelivery wrap = 1; }  // the same, to a Delegation's reader key
// wrap_aad = u8(1 ReaderWrap | 2 DelegationWrap) || group_id || u64be(g) || C_g || SHA-256(recipient)
//            || recipient_key_sha256 || u8(delivery_kind), then, LATE only, u64be(auth.version) || auth.chain
//            || i64be(time_ms)

message ReaderKey {              // §6 Signed, purpose reader-key (10.5): every reader keeps a current one
  bytes sidecar_id = 1;
  bytes xwing_public_key = 2;
  int64 not_after = 3;           // ms since the epoch, at most 7 days after signing
}

message GroupForm {              // §6 Signed, purpose group-form, at gkm/repo/<repo_id>/<seq> (10.6): gkm-1's fields,
                                 //   its signer Signed's
  bytes repo_id = 1;
  bytes group_id = 2;
  bytes previous_group_id = 3;   // the group this one re-forms, or empty
  uint64 generation = 4;
}

// commit rides gkm:<group_id>, and the rest the per-client gkm topic (10.14).
enum GkmHintKind {
  GKM_HINT_KIND_UNSPECIFIED = 0;
  GKM_HINT_COMMIT = 1;
  GKM_HINT_PENDING = 2;
  GKM_HINT_WELCOME = 3;
  GKM_HINT_KEY_PACKAGES_LOW = 4;
  GKM_HINT_WRAP_PENDING = 5;     // a GenWrap, wrap or sealed GroupInfo is missing
}

message GkmHint {                // §6 0x1301, in PushHint.hint
  bytes group_id = 1;
  uint64 epoch = 2;
  GkmHintKind kind = 3;
  bytes recipient = 4;           // 10.6's late wraps: the ask's s: or d: recipient, as its wrap path writes it
}

// gkm/<group_id>/epoch/<n>, whose key names its group and epoch. gkm writes uploader, time_ms and header itself, from the
// token, its clock and the commit, so a client's GkmEpochRequest has no such field to state falsely.
message GkmEpochObject {
  bytes commit = 1;              // an MLSMessage: PrivateMessage, or an external commit's PublicMessage; empty at epoch 0
  GkmCommitHeader header = 2;    // gkm's copy of the commit's authenticated_data, for its own checks: a member reads the
                                 //   one MLS authenticates. At epoch 0, gen/1's generation and auth
  bytes uploader = 3;            // sidecar_id; at epoch 0 the creator (gkm-1)
  int64 time_ms = 4;             // gkm's clock at the write
  bytes gen_wrap = 5;            // GenWrap_n, of header.generation; empty at a generation-0 self-join (10.8)
  bytes sealed_group_info = 6;   // GroupInfo_n in every epoch at most 16 leaves, a generation-0 self-join's included, or
                                 //   recovery with no leaf online finds a newest epoch it cannot join from; else empty
  uint64 group_info_generation = 7;  // whose K_groupinfo seals it (KF5: "the generation it names"), which at a
                                     //   generation-0 self-join is the newest the joiner holds, not header.generation
  bytes network_id = 8;          // epoch 0 only (gkm-1), from the token
  uint32 cipher_suite = 9;       // epoch 0 only (gkm-1); 0x0010 (owner decision 44)
}

// gkm/<group_id>/group-info, and the body of POST and GET .../group-info. At most 16 leaves it is the pointer {epoch},
// and that epoch's object holds the sealed GroupInfo; above 16, it holds it here.
message GkmGroupInfoObject {
  uint64 epoch = 1;              // rises at each write (10.6)
  uint64 generation = 2;         // above 16 leaves, whose K_groupinfo seals it, which may pass the epoch's own header
                                 //   (KF5: "the generation it names"); 0 in a pointer
  bytes sealed_group_info = 3;   // GroupInfo_epoch, above 16 leaves; empty in a pointer
}

// gkm/welcome/<sidecar_id>/<ref>, written with the Welcome.
message GkmWelcomePointer {
  bytes group_id = 1;
  uint64 epoch = 2;              // n of gkm/<group_id>/welcome/<n>
}

// gkm/kp/<sidecar_id>/<ref>.claim. The target is the sidecar_id in its key.
message GkmKeyPackageClaim {
  bytes group_id = 1;
  bytes claimer = 2;             // sidecar_id
}

// POST /gkm/key-packages. Each is a bare MLS KeyPackage: its credential names the sidecar, and its own extensions say
// whether it is last-resort, so the wire states neither twice.
message GkmKeyPackagesRequest {
  repeated bytes key_packages = 1;
}

// POST /gkm/key-packages/claim.
message GkmKeyPackageClaimRequest {
  bytes group_id = 1;
  bytes target = 2;              // the sidecar_id being added
}
message GkmKeyPackageClaimReply {
  bytes key_package_ref = 1;     // <ref>
  bytes key_package = 2;
}

// POST /gkm/groups (KF1), which writes the GroupForm, epoch/0 and gen/1, each If-None-Match. epoch/0's network_id and
// uploader come from the token.
message GkmGroupCreateRequest {
  Signed form = 1;               // a GroupForm
  Signed gen_rotate = 2;         // generation 1's GenRotate, without a parent
  bytes gen_wrap = 3;            // GenWrap_0
  bytes sealed_group_info = 4;   // GroupInfo_0
  uint32 cipher_suite = 5;
}

// GET /gkm/groups/<id>.
message GkmGroupReply {
  Signed form = 1;               // the GroupForm that names this group
}

// POST /gkm/groups/<id>/epochs/<n>. Each field means what GkmEpochObject's does.
message GkmEpochRequest {
  bytes commit = 1;
  bytes gen_wrap = 2;
  bytes sealed_group_info = 3;
  uint64 group_info_generation = 4;
}

// GET /gkm/groups/<id>/epochs?after=. An answer stops at gkm's bound, so a device asks again after its last epoch
// until none comes.
message GkmEpochEntry {
  uint64 epoch = 1;
  uint64 size = 2;               // the stored object's bytes
  GkmEpochObject object = 3;
}
message GkmEpochsReply {
  repeated GkmEpochEntry epochs = 1;  // in order
}

// GET /gkm/groups/<id>/gen?since= and .../drop-key?since=. The gen route stops at gkm's bound as GkmEpochsReply does,
// and the drop-key route at 64 (10.14).
message GkmGenerationsReply {
  repeated Signed generations = 1;  // GenRotates, in order
}

// GET /gkm/groups/<id>/wraps/<g>.
message GkmWrapsReply {
  repeated Signed wraps = 1;     // ReaderWraps and DelegationWraps, the asked key's first
}

// POST /gkm/groups/<id>/welcome/<n>. gkm stores welcome bare at gkm/<group_id>/welcome/<n>, then writes one
// GkmWelcomePointer per recipient, which the MLS Welcome alone cannot name: its refs say no sidecar.
message GkmWelcomeRecipient {
  bytes sidecar_id = 1;
  bytes key_package_ref = 2;     // <ref>
}
message GkmWelcomeRequest {
  bytes welcome = 1;
  repeated GkmWelcomeRecipient recipients = 2;
}

// GET /gkm/welcomes: each pointer with its Welcome, which no other route serves.
message GkmWelcomeEntry {
  bytes key_package_ref = 1;     // <ref>
  GkmWelcomePointer pointer = 2;
  bytes welcome = 3;
}
message GkmWelcomesReply {
  repeated GkmWelcomeEntry welcomes = 1;
}

// POST /gkm/groups/<id>/ack, for the token's own leaf, at gkm's clock.
message GkmAckRequest {
  uint64 epoch = 1;              // the leaf's newest applied epoch
}

// POST and GET /gkm/recovery/<member_id>/wraps. The object gkm/recovery/<member_id>/<group_id>/<g>/<c8>/<b8> holds
// ciphertext bare, and these fields are its path.
message GkmRecoveryWrap {
  bytes group_id = 1;
  uint64 generation = 2;         // g
  bytes commitment_prefix = 3;   // C_g[0:8], which c8 writes as hex
  bytes binding_prefix = 4;      // SHA-256(the binding's Ed25519 key)[0:8], which b8 writes as hex
  bytes ciphertext = 5;          // RecoveryWrap_{m,g}
}
message GkmRecoveryWrapsReply {
  repeated GkmRecoveryWrap wraps = 1;
}
