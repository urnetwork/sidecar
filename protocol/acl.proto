// §8's rows inside §7.9's ProjectionRows, ids only, and §8.8's grant chains and access logs. GrantRevoke,
// Suspend and Unsuspend live in bridge/auth.proto, because the device role applies them between states,
// and this file imports them and never redeclares them (§4.9).
//
// §8.8 writes AclAtom, AclRule, AclRepo and its statements as field lists without numbers, and §8.4 and
// §11.12 write actions, autogroups and kinds as names. They take numbers in the order written, a
// statement's StatementHeader being field 1, and are open to review until these formats freeze at M2.

syntax = "proto3";
package urnetwork.sidecar;

import "protocol/bridge/auth.proto";
import "protocol/bridge/signed.proto";

option go_package = "github.com/urnetwork/sidecar/protocol";

message AclRows {
  bool has_document = 1;                  // owner decisions 50, 105
  repeated AclAtom atoms = 2;             // §7.9's keyed tag and group ids -> member_ids, sidecar_ids
  repeated AclRule rules = 3;
  repeated AclRequestRule requests = 4;
  repeated AclRepo repos = 5;
  bytes bridge = 6;                       // §17's id-only section
  AclAudit audit = 7;                     // owner decision 63; Team only
  repeated AclSuspension suspensions = 8; // active Suspends a fold kept (plan-ACL-folded-grant-state #1)
  repeated AclSpentGrant spent_grants = 9; // activated and revoked grant ids (plan-ACL-folded-grant-state #3)
  // The document's effective evidenceDefault, compiled at each base as each AclRequestRule's evidence is: the
  // ApprovalDecision.channel values accepted for an action no requests rule names (dns_set, dns_delete,
  // bridge_expose); default all three (QD-727)
  repeated uint32 evidence_default = 10;
}

// A tag or group atom, or a selector with no table name compiled to a derived atom: the first 16 bytes of
// SHA-256("urnetwork-sidecar-v1/acl-atom" || 0x00 || kind || 0x00 || value), kind one byte (1 member,
// 2 sidecar, 3 client, 4 network, 5 role, 6 principal), each value already server-visible
// (plan-ACL-nonsidecar-subjects). A tag atom's member_ids stays empty, and its sidecar_ids lists the
// sidecars carrying it (plan-ACL-atom-and-rule-ids #4).
message AclAtom {
  bytes atom = 1;
  repeated bytes member_ids = 2;
  repeated bytes sidecar_ids = 3;
  repeated bytes tag_owner_member_ids = 4;  // a tag atom's tagOwners, expanded to member_ids at compile
  repeated bytes client_ids = 5;            // client:<id> for a client no binding names
  repeated bytes network_ids = 6;           // network:<net>, its label resolved at save
  string role = 7;                          // role:<name>, on Embed networks
  string principal = 8;                     // principal:<name>, on Embed networks
}

// §8.4's autogroups as atoms, autogroup:dst-owner fixed at M2 because the implicit document's directory
// rule names it, which readers evaluate from then (D-PHASE-9). In a *_atoms field, one of these is 16
// bytes: fifteen zeros, then this value.
enum AclAutogroup {
  ACL_AUTOGROUP_UNSPECIFIED = 0;
  ACL_AUTOGROUP_MEMBER = 1;
  ACL_AUTOGROUP_OWNER = 2;
  ACL_AUTOGROUP_ADMIN = 3;
  ACL_AUTOGROUP_AUDITOR = 4;
  ACL_AUTOGROUP_SIDECAR = 5;
  ACL_AUTOGROUP_TAGGED = 6;
  ACL_AUTOGROUP_NETWORK = 7;
  ACL_AUTOGROUP_UNTAGGED = 8;
  ACL_AUTOGROUP_EPHEMERAL = 9;
  ACL_AUTOGROUP_PUBLIC = 10;
  ACL_AUTOGROUP_INTERNET = 11;
  ACL_AUTOGROUP_SELF = 12;
  ACL_AUTOGROUP_SPONSOR = 13;
  ACL_AUTOGROUP_DST_OWNER = 14;
}

// Values of AclRule.actions and AclRequestRule.actions (§8.4).
enum AclAction {
  ACL_ACTION_UNSPECIFIED = 0;
  ACL_ACTION_DIAL = 1;
  ACL_ACTION_LISTEN = 2;
  ACL_ACTION_ROUTE = 3;
  ACL_ACTION_READ = 4;
  ACL_ACTION_WRITE = 5;
  ACL_ACTION_ADMIN = 6;
  ACL_ACTION_DEPOSIT = 7;
  ACL_ACTION_PUBLISH = 8;
  ACL_ACTION_SEND = 9;
}

enum AclAudience {
  ACL_AUDIENCE_UNSPECIFIED = 0;           // members, the default
  ACL_AUDIENCE_MEMBERS = 1;
  ACL_AUDIENCE_MEMBERS_DEVICE = 2;
  ACL_AUDIENCE_LINK = 3;
  ACL_AUDIENCE_PUBLIC = 4;
}

enum AclAppMode {
  ACL_APP_MODE_UNSPECIFIED = 0;           // http, the default
  ACL_APP_MODE_HTTP = 1;
  ACL_APP_MODE_RAW = 2;
}

// A port range as a client checks it. Rows carry none (plan-BRIDGE-gate-row-prefixes #1): this rides only a
// grant's own fields on the device (AclGrantAsk), never AclRows.
message AclPortRange {
  uint32 protocol = 1;                    // the IP protocol number; 0 any
  uint32 first = 2;
  uint32 last = 3;
}

// Ports and CIDRs stay in AclLocalPolicy, from the sealed policy, so a server sees whether a rule limits ports,
// never which (plan-BRIDGE-gate-row-prefixes #1, §17.8). A route rule's targets are its via subjects; one with no
// via names none, and the advertisers BridgeRoute.route_rule_ids names stand in at id level.
message AclRule {
  reserved 5;
  reserved "ports";
  bytes rule_id = 1;
  repeated bytes src_atoms = 2;
  repeated AclTarget targets = 3;
  repeated uint32 actions = 4;            // AclAction
  int64 expires = 6;                      // ms since the epoch; 0 none
  AclAudience audience = 7;               // a publish's (8.4)
  AclAppMode app_mode = 8;
  bytes link_spki_sha256 = 9;             // the pin in full, as a requested grant's GrantActivate shows it to
                                          // api anyway (§16.6 AD4)
  bytes source_rule_id = 10;              // an activated grant's: the requests rule its CanonicalAction names,
                                          // whose deletion ends it (plan-ACL-folded-grant-state #2)
  bool ports_limited = 11;                // the rule's ip field names ports: a legacy client is reached only
                                          // under a dial grant with none (§8.10, D-ACL-5)
}

message AclRequestRule {
  bytes rule_id = 1;
  repeated bytes src_atoms = 2;
  repeated AclTarget targets = 3;
  repeated uint32 actions = 4;            // AclAction
  repeated bytes approver_atoms = 5;
  uint32 approvers = 6;
  int64 default_expiry_seconds = 7;       // expiresDefault: 1 h unless the document overrides it
  int64 max_expiry_seconds = 8;           // maxExpiry: 30 days unless the rule overrides it
  repeated uint32 evidence = 9;           // accepted ApprovalDecision.channel values (§16.8); default all three
}

// §11.12's kinds, fixed at creation. directory is known from M2, since the team directory runs on format
// 1's streams from M6 (D-PHASE-9).
enum RepoKind {
  REPO_KIND_UNSPECIFIED = 0;
  REPO_KIND_GENERAL = 1;
  REPO_KIND_RECORD = 2;
  REPO_KIND_CONFIG = 3;
  REPO_KIND_DIRECTORY = 4;
  REPO_KIND_TEAM_RECORD = 5;
  REPO_KIND_MAILCFG = 6;
  REPO_KIND_VAULT = 7;
  REPO_KIND_MAILBOX = 8;
  REPO_KIND_SECRET = 9;
}

enum RepoGrantRole {
  REPO_GRANT_ROLE_UNSPECIFIED = 0;
  REPO_GRANT_ROLE_DEPOSIT = 1;
  REPO_GRANT_ROLE_READER = 2;
  REPO_GRANT_ROLE_WRITER = 3;
}

// Folded from M2, enforced from format 2 (D-PHASE-9).
enum RepoVersioningLock {
  REPO_VERSIONING_LOCK_UNSPECIFIED = 0;
  REPO_VERSIONING_LOCK_LOCKED = 1;
  REPO_VERSIONING_LOCK_UNLOCKED = 2;
}

// A repo's folded access log. Every row keeps its signer sidecar_id and the log position of the entry
// carrying it, for §7.9's cascade.
message AclRepo {
  bytes repo_id = 1;
  RepoKind kind = 2;
  bytes owner_member_id = 3;
  repeated bytes consented_sidecar_ids = 4;  // the owner's (§8.5), whose consenting admission, AdmissionConfirm
                                             // and OwnerConfirm signers and positions §7.9's SidecarRow keeps
  repeated AclRepoAdminRow admins = 5;
  repeated AclRepoGrantRow grants = 6;
  repeated AclRepoShareRow shares = 7;
  repeated AclRepoRevokeRow revokes = 8;     // config writers' standing RepoRevokes
  AclRepoDeletionRow deletion = 9;           // the newest RepoDelete with any RepoRestore of its deletion_id
  RepoVersioningLock lock = 10;              // the newest RepoVersioning's
  uint64 holders_shrunk_at = 11;             // the newest log position that dropped a key holder (§7.9)
  repeated AclRepoPrefixRulesRow prefix_rules = 12;  // every RepoPrefixRules that took effect on this repo, in
                                                     // position order, for the repo's life: never shortened or
                                                     // reordered, a set staying after a later one replaces it, since
                                                     // pushes pinned in its span are judged by it (DESIGN-DETAILS
                                                     // 16.2.3); at most AclPrefixSettings.SetMaxCount
}

// A RepoAdmin{remove} stamps removed_at and keeps the row, so a reader judges the admin's right at a position before
// its removal; the next base's compile drops a row whose removal its retention point has passed (QD-743).
message AclRepoAdminRow {
  bytes sidecar_id = 1;
  bytes signer = 2;
  uint64 at = 3;
  uint64 removed_at = 4;                  // the RepoAdmin{remove}'s position; 0 while the admin stands
}

message AclRepoGrantRow {
  bytes subject = 1;
  RepoGrantRole role = 2;
  int64 expires = 3;                      // ms since the epoch; 0 none
  bytes signer = 4;
  uint64 at = 5;
}

message AclRepoShareRow {
  bytes subject = 1;
  int64 expires = 2;                      // ms since the epoch; 0 none
  bytes signer = 3;
  uint64 at = 4;
}

message AclRepoRevokeRow {
  bytes subject = 1;
  bytes signer = 2;
  uint64 at = 3;
}

message AclRepoDeletionRow {
  bytes deletion_id = 1;
  bool now = 2;
  uint64 deleted_at = 3;
  uint64 restored_at = 4;
  int64 deleted_time_ms = 5;              // the RepoDelete entry's time_ms, which RepoRestore's 7 days and §11.12's
                                          // shred start count from once the log no longer keeps the entry (QD-743)
  bytes signer = 6;                       // the RepoDelete's signer sidecar_id, as every row keeps its signer: what
                                          // §11.12's deleted{deletion_id, time, signer} names once the log no longer
                                          // keeps the entry (QD-798)
}

// One RepoPrefixRules that took effect: its signer and position, and nothing of its body, which stays in the log's
// entry and the config head's fold record (DESIGN-DETAILS 16.2.3). The set in force at a push's pin is the newest
// row at or below it.
message AclRepoPrefixRulesRow {
  bytes signer = 1;                       // the statement's signer, a sidecar_id
  uint64 at = 2;                          // the entry that carried it
}

message AclAudit {                        // a reader every member sees (owner decision 63)
  repeated bytes reader_atoms = 1;
  repeated uint32 repo_kinds = 2;         // RepoKind
  repeated bytes repo_ids = 3;
  bytes audit_opt_in = 4;                 // the k-of-n AuditOptIn record, which api and readers verify
}

// Exactly one kind set, in the forms CompileAcl writes (acl-m2-02-state-readings #2): repo_id sixteen zero bytes is
// every general or record repo (evs:*, a bare *); socket_tokens one name's token path under one K_sock, a rotation
// adding a second target under the previous key (plan-SOCK-ksock-rotation); socket_prefix with no token every
// application and share/ socket; public_name a tls/ or smtp/ name or a dns host, glob kept, told apart by a /.
message AclTarget {
  reserved 8;                             // an ip target's CIDR, kept in AclLocalPolicy, never in rows
  bytes atom = 1;
  bytes sidecar_id = 2;
  bytes network_id = 3;
  bytes repo_id = 4;
  repeated bytes socket_tokens = 5;       // §9.4's token path
  bool socket_prefix = 6;                 // whole-segment prefix; finer globs project to their literal prefix
  string public_name = 7;                 // tls/ and smtp/ sockets, dns hosts
  bool mail_send = 9;
  bytes client_id = 10;                   // a client no binding names, under an unrestricted grant
                                          // (D-ACL-5; plan-ACL-nonsidecar-subjects)
}

// An active Suspend a fold keeps until an Unsuspend of its own suspend_id lands. signer_class settles who may
// lift it: 1 owner or sponsor, 2 admin, 3 k of n (plan-ACL-folded-grant-state #1).
message AclSuspension {
  bytes subject = 1;
  bytes suspend_id = 2;
  uint32 signer_class = 3;
  bytes signer = 4;
  uint64 at = 5;
}

// A grant_id an activation or revocation spent, kept until the newest ConfigRecord.time_ms in the head passes
// retain_until_ms; 0 keeps it for the network's life (plan-ACL-folded-grant-state #3).
message AclSpentGrant {
  bytes grant_id = 1;
  int64 retain_until_ms = 2;
}

// §8.8's statements: §6 Signed, purpose acl unless noted, each opening with a StatementHeader.

message GrantActivate {                   // any admitted sidecar; authority only from the embedded decisions
  StatementHeader header = 1;
  bytes grant_id = 2;
  bytes canonical_action = 3;             // §16.8's CanonicalAction, as stored
  repeated Signed decisions = 4;          // ApprovalDecisions
}

message EvsShare {                        // a consented device of the repo's owner (8.5), for owner-bound kinds
  StatementHeader header = 1;
  bytes repo_id = 2;
  bytes subject = 3;
  int64 expires = 4;                      // ms since the epoch; optional, 0 none. Defined at M2 and honored by
                                          // every reader as RepoGrant's is, so a time-bound share ends with no
                                          // device online (D-PHASE-9)
}

message OwnerConfirm {                    // a consented device of the sidecar's member (8.5; owner decision 126)
  StatementHeader header = 1;
  bytes sidecar_id = 2;
}

// The access log of one repo_id (owner decision 8).

message RepoCreate {
  StatementHeader header = 1;
  bytes repo_id = 2;
  RepoKind kind = 3;
}

enum RepoAdminChange {
  REPO_ADMIN_CHANGE_UNSPECIFIED = 0;
  REPO_ADMIN_CHANGE_ADD = 1;
  REPO_ADMIN_CHANGE_REMOVE = 2;
}

message RepoAdmin {
  StatementHeader header = 1;
  bytes repo_id = 2;
  bytes sidecar_id = 3;
  RepoAdminChange change = 4;
}

message RepoGrant {
  StatementHeader header = 1;
  bytes repo_id = 2;
  bytes subject = 3;
  RepoGrantRole role = 4;
  int64 expires = 5;                      // ms since the epoch; 0 none
}

message RepoRevoke {
  StatementHeader header = 1;
  bytes repo_id = 2;
  bytes subject = 3;
}

message RepoDelete {
  StatementHeader header = 1;
  bytes repo_id = 2;
  bytes deletion_id = 3;                  // random
  bool now = 4;
}

message RepoRestore {
  StatementHeader header = 1;
  bytes repo_id = 2;
  bytes deletion_id = 3;
}

// v1 (owner decision 160). Format-1 code verifies it, folds the lock and skips sealed_rules, enforcing
// nothing (D-PHASE-9); format 2 enforces the lock.
message RepoVersioning {
  StatementHeader header = 1;
  bytes repo_id = 2;
  RepoVersioningLock lock = 3;
  bytes sealed_rules = 4;                 // optional: config.proto's VersioningRules. An owner-bound repo's are
                                          // sealed to its own generation, others' to the config's
}

// v1, Q-EVS-3 (a) (QD-212; DESIGN-DETAILS 16.2.2): a repo admin or a config writer, only in a general repo that is not
// deleted. From M2 every verifier checks its id-level rule, reading sealed_rules' length alone, and folds {signer, at}
// into AclRepo.prefix_rules; readers enforce the rules from M6 (D-PHASE-9).
message RepoPrefixRules {
  StatementHeader header = 1;
  bytes repo_id = 2;
  bytes sealed_rules = 3;                 // a PrefixRuleSet in config_seal's form, sealed to the repo's own generation:
                                          // 48 B and a positive multiple of 256 B
}

// The plaintext of RepoPrefixRules.sealed_rules, which no server ever holds. A set with no rule names nobody, so
// nobody may write; the one rule {autogroup:sidecar, no path} restricts nobody.
message PrefixRuleSet {
  repeated PrefixRule rules = 1;          // ascending by (subject, path), no rule twice
}

message PrefixRule {
  bytes subject = 1;                      // 16 B: a sidecar_id, a member_id, a tag id, or the autogroup atom of
                                          // sidecar, member, tagged or ephemeral
  repeated bytes path = 2;                // the prefix in whole components, §11.6's raw names; none: every path
  PrefixAction action = 3;
}

enum PrefixAction {
  PREFIX_ACTION_UNSPECIFIED = 0;
  PREFIX_ACTION_WRITE = 1;                // the only action
}

// Authority statements, purpose authority, k of n (§7.9).

message AuditOptIn {
  StatementHeader header = 1;
  repeated bytes reader_atoms = 2;
  int64 not_after = 3;                    // ms since the epoch
}

message AuditOptOut {
  StatementHeader header = 1;
}
