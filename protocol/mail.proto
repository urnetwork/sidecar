// What mxedge tells a receiver about a sender (§15.4), the evidence a receiver seals at reception (§15.5), the
// deposit that carries both (§15.7), and the files of a mailbox and of mailcfg (§15.7, §15.8).
//
// Only MailIngress, on a Required stream (§2.8's mx-1), and MailHint, a kind and a host in PushHint.hint, pass through
// a server. Everything else here is sealed under §11, so it needs no §2.8 row, and the device role parses none of it,
// so it lives in protocol and not protocol/bridge.
//
// §15.5 fences MailIngress, MailAuthEvidence and AuthLimits. The rest take their numbers from the answers to
// plan-MAIL-format-bytes and plan-SMTP-wire-gaps#4, with the readings mail-proto-format-readings accepted, and their
// names from §14.5, §15.7, §15.8 and §15.15 wherever those lists give one: MAIL-FORMAT.md gives their rules and
// containers, testdata/mail/vectors.yml pins their bytes, and their numbers stay open until §15's formats freeze at
// M7. Every enum starts at 0 unspecified, then the values written, and no message here holds a oneof (§6.11) or a
// map, so an encoding depends on neither a leg nor a run.

syntax = "proto3";
package urnetwork.sidecar;

option go_package = "github.com/urnetwork/sidecar/protocol";

message MailIngress {                // 0x1701 (§6.11), in StreamOpen.metadata, <= 1,024 B
  reserved 4, 6, 7;                  // destination_ip, route, burner_id: SNI-only routing
  uint32 version = 1;
  bytes sender_ip = 2;
  uint32 sender_port = 3;
  string sni = 5;
  string ehlo_name = 8;              // pre-TLS argument, <= 255 B
  string ptr_name = 9;               // mxedge's forward-confirmed PTR, or ""; labels use the receiver's own
  repeated string ip_listings = 10;  // categories from the local feed mirror, e.g. "pbl"
  uint64 receive_time_millis = 11;
}

message MailAuthEvidence {         // sealed in the deposit header beside MailIngress (15.7); at most 8,192 B
  uint32 version = 1;              //   whatever its identifiers, by the evidence row below
  bytes message_sha256 = 2;        // the bytes as received, before ingest adds headers
  uint64 receive_time_millis = 3;
  bytes receiver_sidecar_id = 4;
  SpfResult spf = 5;               // pass|fail|softfail|neutral|none|temperror|permerror|incomplete;
                                   //   domain, ip, records
  repeated DkimResult dkim = 6;    // per selected signature, in selection order: d=, s=,
                                   //   pass|fail|permerror|temperror|incomplete, the public key relied on
  DmarcResult dmarc = 7;           // the record (p, adkim, aspf), alignment, pass|fail|none|temperror
  string ptr_name = 8;             // the receiver's own forward-confirmed PTR of sender_ip, or ""
  bool sni_tlsa_live = 9;          // the SNI host's TLSA held this receiver's key
  ArcResult arc = 10;              // cv= (none|pass|fail|incomplete), and each verified set's d=, s= and key
  bool strict_chain = 11;          // mail.strict: SNI named a custom MX host, and this receiver's zone watch
                                   //   (D-TRUST-9) holds every recipient domain's MX hosts and that host's
                                   //   TLSA, with this key, customer-signed, none in a URnetwork zone
  AuthLimits limits = 12;          // set only when a bound below cut the work
}
message AuthLimits {
  uint32 reason = 1;               // bits: 1 a count or size bound, 2 the 30 s deadline
  uint32 dkim_seen = 2;            // DKIM-Signature fields counted, at most 64
  uint32 dkim_checked = 3;         // those selected and looked up, at most 8
  uint32 arc_sets = 4;             // the highest ARC instance seen
  uint32 dns_queries = 5;          // queries sent, DohCache hits excluded
  uint32 dropped = 6;              // dkim and arc entries dropped to stay within 8,192 B
}

enum SpfVerdict {
  SPF_VERDICT_UNSPECIFIED = 0;
  SPF_PASS = 1;
  SPF_FAIL = 2;
  SPF_SOFTFAIL = 3;
  SPF_NEUTRAL = 4;
  SPF_NONE = 5;
  SPF_TEMPERROR = 6;
  SPF_PERMERROR = 7;
  SPF_INCOMPLETE = 8;
}

message SpfResult {
  SpfVerdict result = 1;
  string domain = 2;
  bytes ip = 3;                    // 4 or 16 B, as MailIngress.sender_ip
  repeated string records = 4;     // the records relied on, never a DNS transcript (15.5)
}

enum DkimVerdict {
  DKIM_VERDICT_UNSPECIFIED = 0;
  DKIM_PASS = 1;
  DKIM_FAIL = 2;
  DKIM_PERMERROR = 3;
  DKIM_TEMPERROR = 4;
  DKIM_INCOMPLETE = 5;
}

message DkimResult {               // a selected signature; an unselected one has no entry
  string domain = 1;               // d=
  string selector = 2;             // s=
  DkimVerdict result = 3;
  bytes public_key = 4;            // the key relied on, which the evidence row drops first
}

enum DmarcVerdict {
  DMARC_VERDICT_UNSPECIFIED = 0;
  DMARC_PASS = 1;
  DMARC_FAIL = 2;
  DMARC_NONE = 3;
  DMARC_TEMPERROR = 4;
}

message DmarcResult {
  string p = 1;                    // the record's tags
  string adkim = 2;
  string aspf = 3;
  uint32 alignment = 4;            // bits: 1 SPF aligned, 2 DKIM aligned
  DmarcVerdict result = 5;
}

enum ArcVerdict {
  ARC_VERDICT_UNSPECIFIED = 0;
  ARC_NONE = 1;
  ARC_PASS = 2;
  ARC_FAIL = 3;
  ARC_INCOMPLETE = 4;
}

message ArcSet {                   // a verified set
  string domain = 1;               // d=
  string selector = 2;             // s=
  bytes public_key = 3;
}

message ArcResult {
  ArcVerdict cv = 1;
  repeated ArcSet sets = 2;
}

enum MailHintKind {
  MAIL_HINT_KIND_UNSPECIFIED = 0;  // a protocol error (§6.11)
  MAIL_HINT_DEPOSIT = 1;           // reserved and never sent: a deposit reaches readers by evs's hint (plan-MAIL-hints)
  MAIL_HINT_RECEIVER_NEEDED = 2;   // the router met host with no receiver, and hints its published ones
}

message MailHint {                 // §6 0x1702, in PushHint.hint on topic mail (§15.15), at most 256 B
  MailHintKind kind = 1;
  string host = 2;                 // mx or mx.<scope>, as mail_host_key names it (§2.8's mx-3)
}

// A same-network deposit (D-MAIL-8) sets version, mail_from and recipients only, its signature being the push's.
message MailDeposit {              // a deposit's sealed trailer (15.7), one per repo; evs sees none of it
  uint32 version = 1;
  MailIngress ingress = 2;         // a receiver's deposit only
  MailAuthEvidence evidence = 3;   // a receiver's deposit only, and one without is "evidence unavailable" (15.5)
  bytes mail_from = 4;             // MAIL's reverse path as received, no brackets, empty for <>; the sender's bytes,
                                   //   so bytes, as a string would refuse what is not UTF-8
  bool require_tls = 5;            // MAIL carried REQUIRETLS (RFC 8689)
  repeated string recipients = 6;  // this repo's RCPT addresses, in order, at most 100: never another repo's
  uint32 tls_version = 7;          // the session's, as IANA numbers it, 0x0304 for 1.3
  uint32 tls_suite = 8;            // the session's cipher suite, as IANA numbers it
  bytes receiver_sidecar_id = 9;   // the depositing receiver, which ingest holds to the deposit push's signer
}

enum MailAddressKind {
  MAIL_ADDRESS_KIND_UNSPECIFIED = 0;
  MAIL_ADDRESS_ADMIN = 1;
  MAIL_ADDRESS_ID = 2;
  MAIL_ADDRESS_GROUP = 3;
  MAIL_ADDRESS_AGENT = 4;
  MAIL_ADDRESS_BURNER = 5;
  MAIL_ADDRESS_BOUNCE = 6;
}

message MailAddress {              // mailcfg addr/<h>/<address>, created only if absent (15.8)
  MailAddressKind kind = 1;
  bytes mailbox = 2;               // the repo id mail for this address goes to
  repeated bytes members = 3;      // a group's member_ids, at most mail_group_members
  bytes creator = 4;               // the sidecar_id of the push that created it, which readers hold to that signer
  bytes effect_key = 5;            // the use's 32 B key, under a decision (§16 D-MCP-11); else empty
}

enum MailBurnerState {
  MAIL_BURNER_STATE_UNSPECIFIED = 0;
  MAIL_BURNER_LIVE = 1;
  MAIL_BURNER_PAUSED = 2;
  MAIL_BURNER_BURNED = 3;
}

message MailBurner {               // mailcfg burner/<h>/<blabel>, created only if absent, kept forever once burned
  bytes mailbox = 1;               // the repo id mail for this label goes to
  MailBurnerState state = 2;
  bool replying = 3;               // has its own selector and records (15.9)
  uint64 created = 4;              // ms since the epoch
  bytes effect_key = 5;            // as MailAddress's, and the seed of the DRBG that drew this label
}

message IndexEntry {               // one message in an i/ segment; every value is sealed and most are the sender's
  bytes id = 1;                    // the message id, which is the deposit id: 16 B
  string address = 2;              // the first of the deposit's recipients in this repo
  uint64 time = 3;                 // the sealed receive time, ms since the epoch (MAIL-FORMAT.md)
  string from = 4;                 // the From header's value
  string subject = 5;
  string snippet = 6;              // the first text part's start, at most 200 B
  string message_id = 7;           // the Message-ID header's value, no brackets, or ""
  bytes thread_key = 8;            // 16 B, alike across a thread (MAIL-FORMAT.md)
  uint64 size = 9;                 // the message's bytes as received
  repeated MailAttachment attachments = 10;
  MailAuthResults auth_results = 11;  // from the deposit's MailAuthEvidence; absent on a same-network deposit
  MailTlsLabel tls_label = 12;
  MailTlsBasis tls_basis = 13;     // absent on a same-network deposit
  uint32 spam_score = 14;          // parts per thousand, 0 to 1,000: an integer, so no leg rounds it differently
  string one_time_code = 15;       // a sign-up code found in the message, or ""
}

message MailAttachment {
  string name = 1;
  string type = 2;                 // the part's media type
  uint64 size = 3;                 // its bytes as carried in the message, since ingest never decodes one
}

message MailAuthResults {          // what a message list shows; the message's Authentication-Results header has more
  SpfVerdict spf = 1;
  DkimVerdict dkim = 2;            // pass if any selected signature passed, else the first selected one's verdict
  DmarcVerdict dmarc = 3;
  ArcVerdict arc = 4;
  bool checks_incomplete = 5;      // the evidence's limits was set, which only weakens a label (15.5)
  bool evidence_unavailable = 6;   // a receiver's deposit with no evidence, labeled opportunistic (15.5)
}

enum MailTlsLabel {
  MAIL_TLS_LABEL_UNSPECIFIED = 0;  // a sent copy, or mail no ingest labeled: shown as no label, never as validated
  MAIL_TLS_VALIDATED = 1;
  MAIL_TLS_OPPORTUNISTIC = 2;
  MAIL_TLS_MEMBER_SIGNED = 3;      // the sender's signature replaces the label (D-MAIL-8), if it may send as From
}

enum MailTlsRule {
  MAIL_TLS_RULE_UNSPECIFIED = 0;   // no rule made this label validated
  MAIL_TLS_RULE_REQUIRETLS = 1;
  MAIL_TLS_RULE_OPERATOR = 2;
}

message MailTlsBasis {             // the rule behind a label, kept for rechecks (15.5)
  MailTlsRule rule = 1;
  string operator_id = 2;          // the operator rule's entry in mail_operators.yml (D-MAIL-13)
  uint32 list_version = 3;         // the list the label was decided against
  bool strict_custom_mx = 4;       // set only from a sealed MailAuthEvidence.strict_chain
}

message MailIndexSegment {         // i/<yyyymm>/<n>: at most 1 MiB or 4,096 entries, grown by appending (MAIL-FORMAT.md)
  repeated IndexEntry entries = 1;
}

enum MailFlagKind {
  MAIL_FLAG_KIND_UNSPECIFIED = 0;
  MAIL_FLAG_SEEN = 1;
  MAIL_FLAG_FLAGGED = 2;
  MAIL_FLAG_LABEL = 3;
  MAIL_FLAG_TRASH = 4;
}

message MailFlagOp {               // one change to one message's flag; last writer wins (MAIL-FORMAT.md)
  reserved 6;                      // hlc_count, whose counter rides in hlc's low 16 bits
  bytes message_id = 1;            // IndexEntry.id
  MailFlagKind op = 2;
  bool set = 3;                    // true sets the flag or label, false clears it
  string label = 4;                // op label only, at most 64 B; a verdict is the label spam or not-spam
  uint64 hlc = 5;                  // wall ms << 16 | counter
  bytes sidecar_id = 7;            // the writer, which breaks equal clocks
}

message MailFlagSegment {          // f/<yyyymm>/<n>: at most 4,096 ops, grown by appending (MAIL-FORMAT.md)
  repeated MailFlagOp ops = 1;
}

message MailGroupRef {             // r/<yyyymm>/<h>/<id>, mailboxes only: a group message read in place (15.7)
  bytes repo_id = 1;               // the group repo
  bytes message_id = 2;            // its message there, which is <id>
}

enum VaultEntryState {
  VAULT_ENTRY_STATE_UNSPECIFIED = 0;
  VAULT_ENTRY_LIVE = 1;
  VAULT_ENTRY_BURNED = 2;
}

enum VaultTotpAlgorithm {
  VAULT_TOTP_ALGORITHM_UNSPECIFIED = 0;
  VAULT_TOTP_SHA1 = 1;
  VAULT_TOTP_SHA256 = 2;
  VAULT_TOTP_SHA512 = 3;
}

message VaultEntry {               // vault/<h>/<entry_id>, one key slot each (15.8); its secrets are never logged
  bytes entry_id = 1;              // 16 random bytes
  string address = 2;
  string title = 3;
  string username = 4;
  string password = 5;
  repeated string password_history = 6;  // earlier passwords, oldest first
  VaultTotp totp = 7;
  repeated string urls = 8;
  string notes = 9;
  repeated VaultUsedAt used_at = 10;
  uint64 created = 11;             // ms since the epoch
  uint64 updated = 12;             // ms since the epoch
  VaultEntryState state = 13;
}

message VaultTotp {                // RFC 6238; a writer sets every field, so no default hides here
  bytes secret = 1;
  VaultTotpAlgorithm algorithm = 2;
  uint32 digits = 3;
  uint32 period = 4;               // seconds
}

message VaultUsedAt {
  string registrable_domain = 1;
  uint64 first = 2;                // ms since the epoch
  uint64 last = 3;                 // ms since the epoch
}

message MailForward {              // forward, mailboxes only: the verified address and who forwards to it (15.10)
  string address = 1;
  repeated string burners = 2;     // the opted-in burners, each a <blabel>
  uint64 verified_time_ms = 3;     // when address confirmed its 6-digit code
}

message MailReverseAlias {         // ra/<h>/<token>, mailboxes only (15.10)
  string original_sender = 1;
  string burner_address = 2;
}

// The body of o/<h>/<effect_key>'s Signed, as SIGNED_SMTP_OUTBOX (D-SMTP-18), the message's bytes following that
// Signed in the file (plan-SMTP-wire-gaps#4). MAIL writes o/, so this file declares it.
message SmtpOutboxEntry {
  bytes effect_key = 1;            // the path's, so a signed entry cannot serve another path
  bytes message_sha256 = 2;        // the RFC 5322 bytes after the Signed
  string sender = 3;               // the envelope's address at b.<net>.<root>
  repeated string recipients = 4;  // every recipient of this send, BCC included
  uint32 flags = 5;                // as SmtpPreamble.flags: 1 BULK, 2 REQUIRETLS, 4 BURNER
  repeated string tl4_domains = 6; // recipient domains the composing device's approval lets go at TL4 (§14.4)
  uint64 create_time_ms = 7;
  uint64 approval_not_after = 8;   // ms since the epoch, whence its retry window (§16 D-MCP-11); 0 for no approval
}

enum MailSendMode {
  MAIL_SEND_MODE_UNSPECIFIED = 0;  // §14.5's unknown: no session reached the post-TLS EHLO
  MAIL_SEND_BDAT = 1;              // as SmtpProof.mode
  MAIL_SEND_DATA = 2;
}

enum MailOutcomeKind {
  MAIL_OUTCOME_KIND_UNSPECIFIED = 0;
  MAIL_OUTCOME_SENT = 1;
  MAIL_OUTCOME_QUEUED = 2;
  MAIL_OUTCOME_DEFERRED = 3;
  MAIL_OUTCOME_TOO_LARGE = 4;
  MAIL_OUTCOME_REFUSED = 5;
  MAIL_OUTCOME_TLS_REFUSED = 6;
  MAIL_OUTCOME_FAILED = 7;
}

message MailOutcome {              // one recipient domain's result of a send (§14.5): SmtpDomainOutcome's fields
  string domain = 1;
  MailSendMode mode = 2;
  uint64 byte_count = 3;           // too_large: the message's encoded bytes
  uint64 cap_byte_count = 4;       // too_large: the DATA cap
  MailOutcomeKind outcome = 5;
  uint32 reply_code = 6;           // refused: the MX's
  uint32 retry_after_ms = 7;       // deferred
  uint64 update_time_ms = 8;       // the sending device's last write of this domain's result
  uint32 tls_level = 9;            // 1-4 for TL1-TL4, or 0 if none was reached: the send's I-11 label
}

message MailOutcomeRecord {        // or/<h>/<effect_key>, written by the sending device, kept 30 days
  repeated MailOutcome outcomes = 1;  // one a recipient domain
}

message MailProverRecord {         // p/<sidecar_id>, rewritten at each measurement (§14.5)
  uint64 smtp_data_proof_bytes = 1;
  uint64 data_bytes_per_s = 2;     // the measured DATA rate
  uint64 measure_time_ms = 3;
}

message MailSpamModel {            // s/model (§15.9), a mailbox's naive Bayes filter its people's verdicts train
  uint32 version = 1;              // 1, and a reader refuses another, 0 included
  repeated uint32 counts = 2;      // the spam then the not-spam messages trained, then each of the 4,096 feature
                                   //   buckets' spam count, then each one's not-spam count: 8,194 values
}
