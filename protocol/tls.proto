// What tlsedge tells a listener about a visitor (§13.5), what certs tells a device about its certificates (§13.6),
// what a device signs for its key (§13.8), what a member's device signs for a members-device login (§13.7) and what a
// publishing device signs for a link audience's guests (QD-134). TlsEdgeOpen rides sealed streams only, as
// StreamOpen.metadata, and a listener trusts it only as §9.6's admission step 3 allows. §13 gives TlsHint and
// TlsKeyAttestation no field list, so theirs are plan-TLS-small-readings' first two, every field inside connect-4 or
// cert-1. TlsEdgeLogin and TlsLinkToken reach no server: each travels between the visitor and the front inside TLS,
// TlsEdgeLogin from the member's app or extension.
//
// No oneof: TlsHint rides PushHint.hint and TlsEdgeOpen StreamOpen.metadata (§6.11).

syntax = "proto3";
package urnetwork.sidecar;

option go_package = "github.com/urnetwork/sidecar/protocol";

message TlsEdgeOpen {              // StreamOpen.metadata, edge -> listener (§6 0x1501), <= 512 B
  bytes client_ip = 1;             // 4 or 16 B, from PROXY; edge memory only
  uint32 client_port = 2;
  string server_name = 3;          // normalized SNI
  repeated string alpn = 4;        // offered by the visitor
  uint32 client_hello_byte_count = 5;
  bytes connection_id = 6;         // 16 random B; joins abuse reports for 24 h
  uint64 expire_time_millis = 7;   // the ticket's grant_expire_time_millis; streams end here
}

message TlsHint {                  // §6 0x1502, topic `tls`: the client refetches GET /tls/certs, so a hint is never
                                   // authoritative
  TlsHintKind kind = 1;
  bytes cert_id = 2;               // 16 B, the row's id
}
enum TlsHintKind {
  TLS_HINT_KIND_UNSPECIFIED = 0;
  TLS_HINT_ORDER = 1;              // an order's state moved
  TLS_HINT_ISSUED = 2;
  TLS_HINT_REVOKED = 3;
}

message TlsKeyAttestation {        // the body of a Signed, SIGNED_TLS_KEY_ATTESTATION, purpose tls-key, by the
                                   // device's identity key (§13.8): this key, for these names
  bytes network_id = 1;
  bytes sidecar_id = 2;
  bytes spki_sha256 = 3;           // of the DER SubjectPublicKeyInfo
  bytes identifier_set_sha256 = 4; // TlsIdentifierSetHash
  uint64 issue_time_millis = 5;
}

message TlsEdgeLogin {             // the body of a Signed, SIGNED_TLS_EDGE_LOGIN, purpose edge-login, by a member's
                                   // consented device's identity key (§13.7's members-device): that device vouches
                                   // for the visitor completing this login at this origin
  string origin = 1;               // https://<sni>, with :<port> where it is not 443, as the front issued it
  bytes nonce = 2;                 // 32 random B the front issued for this login, taken once
}

message TlsLinkToken {             // the body of a Signed, SIGNED_TLS_LINK, purpose tls-link, by the publishing
                                   // device's identity key (QD-134): a link audience's guest link, reusable until
                                   // its grant ends
  bytes grant_id = 1;              // the publish grant's rule_id
  string host = 2;                 // the URL's host, which the front holds to the SNI
  uint64 expire_time_millis = 3;   // at most the grant's expires
  bytes nonce = 4;                 // 16 random B, so two links of one grant differ
}
