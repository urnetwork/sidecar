// §7.9's config records: the ones only a sidecar role reads, §6 Signed, purpose authority. Genesis,
// MemberRevoke, SidecarRevoke and the log live in bridge/auth.proto, which this file imports and never
// redeclares (§4.9).
//
// §7.9 writes these as field lists without numbers. They take numbers in the order written, a
// statement's StatementHeader being field 1, and are open to review until §7.9's records freeze at M2.
// A record that §7.9 keeps to config heads, ServiceSettings and VersioningRules, is no statement and
// carries no header.
//
// Where §7.9 seals part of a record to the config's current generation, only ids show and the rest rides
// a sealed field, which opens to the *Body or list message beside it (§2.8's api-7). §7.9 names the seal
// but not its bytes, so the field stays opaque here.
//
// A statement a recovery key signs, a SidecarAdmit, AuthorityProposal or AuthorityCosign, carries that key in
// Signed.key_id, since RecoveryBindBody seals it from api and rows keep only its hash (§7.9's Recovery).

syntax = "proto3";
package urnetwork.sidecar;

import "protocol/bridge/auth.proto";
import "protocol/bridge/signed.proto";

option go_package = "github.com/urnetwork/sidecar/protocol";

message AdminSet {                     // authority
  StatementHeader header = 1;
  repeated bytes owners = 2;           // member_ids
  repeated bytes admins = 3;
  repeated bytes network_admins = 4;
  repeated bytes it_admins = 5;
  uint32 threshold = 6;                // k
}

message MemberAdmit {                  // an Owner or Admin; authority if the member is in the AdminSet
  StatementHeader header = 1;
  bytes member_id = 2;
  MemberRole role = 3;                 // billing_admin, auditor or member
}

message SidecarAdmit {                 // an Owner, Admin or IT admin, or scoped; authority for an AdminSet
                                       // member's device; owner-bound reads need §8.5's consent
  StatementHeader header = 1;
  bytes network_id = 2;
  bytes sidecar_id = 3;
  bytes identity_public_key = 4;
  string identity_alg = 5;             // ed25519 in v0
  bytes member_id = 6;                 // or tag_ids
  repeated bytes tag_ids = 7;
  bool ephemeral = 8;
  int64 not_after = 9;                 // ms since the epoch; agents only
  uint32 capabilities = 10;            // SidecarCapability bits
}

message AdmissionConfirm {             // any signer allowed to admit it
  StatementHeader header = 1;
  bytes sidecar_id = 2;
}

message SponsorSet {                   // an admin (owner decision 83)
  StatementHeader header = 1;
  bytes sidecar_id = 2;
  bytes sponsor_member_id = 3;
}

enum IndexerScope {
  INDEXER_SCOPE_UNSPECIFIED = 0;
  INDEXER_SCOPE_NETWORK = 1;
  INDEXER_SCOPE_MEMBER = 2;
}

// Readers ignore a value they do not know; embed comes later.
enum IndexerService {
  INDEXER_SERVICE_UNSPECIFIED = 0;
  INDEXER_SERVICE_MAIL = 1;
  INDEXER_SERVICE_MIRROR = 2;
  INDEXER_SERVICE_SEARCH = 3;
}

message IndexerSet {                   // network: an Owner or Admin; member: a consented device (§8.5) of the
                                       // subject's member; retire: also the subject itself
  StatementHeader header = 1;
  bytes sidecar_id = 2;
  IndexerScope scope = 3;
  bool retire = 4;
  bytes sealed_services = 5;           // IndexerServices
}

message IndexerServices {
  repeated IndexerService services = 1;
}

message RecoveryBind {                 // the member's consented device (§8.5); authority for an AdminSet member
  StatementHeader header = 1;
  bytes member_id = 2;
  bytes prev_sha256 = 3;               // the replaced binding's key hash
  bytes ed25519_public_key_sha256 = 4;
  bytes sealed_body = 5;               // RecoveryBindBody
}

message RecoveryBindBody {
  bytes xwing_public_key = 1;
  bytes ed25519_public_key = 2;
  bytes genesis_sig = 3;               // Recovery's anchor
}

message RecoveryRebind {               // succeeds a RecoveryBind
  StatementHeader header = 1;
  bytes member_id = 2;
  bytes prev_sha256 = 3;
  bytes ed25519_public_key_sha256 = 4;
  bytes sealed_body = 5;               // RecoveryBindBody
  RecoveryRebindReason reason = 6;
}

message KeyRegister {                  // the member's consented, approval-capable device (§16.6)
  StatementHeader header = 1;
  bytes member_id = 2;
  bytes key_id = 3;
  KeyAlg alg = 4;
  bytes public_key = 5;
  bytes attestation = 6;
  KeyPurpose purpose = 7;
  int64 not_after = 8;                 // ms since the epoch
  // protos-bridge-presence-gaps #3 (QD-086): purpose presence only, written last, 9 then 10. The new key
  // signs the received body before field 9's first byte, as §6.9's signed bytes with purpose key-proof
  // and type SIGNED_KEY_REGISTER, which a verifier slices and never re-marshals: a DER signature here for
  // both §16.6 profiles, and for webauthn-es256 its authenticator_data and client_data_json in field 10,
  // the challenge being those bytes' SHA-256. Nothing may follow them.
  bytes key_signature = 9;
  WebAuthnEvidence key_webauthn = 10;
}

message KeyRevoke {
  StatementHeader header = 1;
  bytes key_id = 2;
}

message Delegation {                   // owner, admin, or tag-owning network admin; a forwarding one only
                                       //   by the sidecar it names
  StatementHeader header = 1;
  bytes pubkey = 2;
  bytes reader_xwing_public_key = 3;   // §10.5
  repeated bytes tag_ids = 4;
  uint32 max_admits = 5;
  int64 not_after = 6;                 // ms since the epoch; required, <= 90 d (7.8)
  ForwardScope forward = 7;            // set means a forwarding Delegation (D-TEAM-33, owner decision 197):
                                       //   no tag_ids, max_admits 0 and not_after 0, so a reader that does
                                       //   not know this field refuses the statement for its missing not_after
}

message DelegationRevoke {
  StatementHeader header = 1;
  bytes delegation_id = 2;
  uint64 since_n = 3;                  // 0, or for a leaked bundle the position from which it parks
}

// The client-only #<bundle> of a pre-approved auth key (§7.8): ur-authkey-<id>-<secret>#<base64url of this>,
// about 200 B, which QR and MDM carry as the same string. Never sent, logged or passed to MCP (D-TEAM-22): no
// request has a field for it, and the client splits it off before anything else runs. The daemon signs its own
// SidecarAdmit with the Delegation's signing key, keeps only the reader seed and erases the rest (§5.6); every
// other copy of the string keeps both seeds. No server decodes it. §7.8 writes it as a field list without
// numbers, so these are in the order written.
message AuthKeyBundle {
  uint32  version = 1;                 // 1
  bytes   genesis_sha256 = 2;          // A_0 = SHA-256(Signed Genesis)
  AuthPin head = 3;                    // the log position the creating device stood at (§7.9)
  bytes   delegation_id = 4;
  bytes   delegation_signing_seed = 5; // 32 B: the Delegation's Ed25519 key, which signs SidecarAdmit
  bytes   delegation_reader_seed = 6;  // 32 B: the Delegation's X-Wing reader key (§10.5)
  repeated bytes tag_ids = 7;          // the Delegation's keyed tag ids, 16 B each, never names
}

enum TeamMailMode {
  TEAM_MAIL_MODE_UNSPECIFIED = 0;      // no choice made: §7.9 writes no default, see ServiceSettings
  TEAM_MAIL_MODE_INDEXERS = 1;         // owner decisions 58, 150; §15.5, §15.6
  TEAM_MAIL_MODE_MEMBER_SCOPES = 2;
}

enum SelfAdmitMode {                   // owner decision 112; device-signed self-admission only
  SELF_ADMIT_MODE_UNSPECIFIED = 0;     // on
  SELF_ADMIT_MODE_ON = 1;
  SELF_ADMIT_MODE_OFF = 2;
}

enum DirectoryRunsMode {
  DIRECTORY_RUNS_MODE_UNSPECIFIED = 0; // auto
  DIRECTORY_RUNS_MODE_AUTO = 1;
  DIRECTORY_RUNS_MODE_PROMPT = 2;
  DIRECTORY_RUNS_MODE_OFF = 3;
}

enum DirectoryWorkersMode {
  DIRECTORY_WORKERS_MODE_UNSPECIFIED = 0;  // on
  DIRECTORY_WORKERS_MODE_ON = 1;
  DIRECTORY_WORKERS_MODE_OFF = 2;
}

// A Team's defaults for run and worker announcements (§16.11; owner decisions 170, 171).
message ServiceDirectorySettings {
  DirectoryRunsMode runs = 1;
  DirectoryWorkersMode workers = 2;
}

// An owner or admin. A zero value means the default each comment gives, but for team_mail, whose default no
// section writes: there zero is no choice made, which grants nothing, so an undesignated tag:mail device
// registers no listener as it would under indexers (D-MAIL-15).
message ServiceSettings {
  TeamMailMode team_mail = 1;
  uint32 stale_leaf_days = 2;          // 90 (§10.9's stale Removes)
  SelfAdmitMode self_admit = 3;
  uint32 witness_bound_hours = 4;      // 72, 24 to 168 (D-TRUST-10, owner decision 129)
  bytes scim_signer = 5;               // none, or the sidecar_id of an admin's indexer (7.6)
  ServiceDirectorySettings directory = 6;  // from v1 (M6), reserved here at M2: older readers ignore it (D-PHASE-9)
}

enum VersioningMode {
  VERSIONING_MODE_UNSPECIFIED = 0;
  VERSIONING_MODE_ON = 1;
  VERSIONING_MODE_OFF = 2;
}

// An empty selector matches all.
message VersioningRule {
  repeated uint32 kinds = 1;           // RepoKind
  repeated bytes repo_ids = 2;
  string path_glob = 3;
  uint64 size_above_bytes = 4;
  VersioningMode versioning = 5;
}

// §9.4's K_sock, the config repo's single-record file socket/key (plan-SOCK-ksock-rotation #2): a config
// writer creates it with the repo, and only config writers' heads change it (§8.8). It rides heads only,
// carries no header, and no server reads it: evs holds the head as ciphertext (§7.9). previous_key and
// rotated_at_ms are set from a rotation until the first writer head at or after rotated_at_ms + 10 min,
// which clears both.
message SocketKeyFile {
  bytes current_key = 1;               // 32 B
  bytes previous_key = 2;              // 32 B during a rotation's overlap, else empty
  int64 rotated_at_ms = 3;             // the rotating head's time, with previous_key, else 0
}

// An Owner, Admin or Network admin. Ordered, first match wins, unmatched paths staying versioned; absent,
// the platform rule [{size_above_bytes: 64 MiB, off}]. v1, its type reserved at M2: format-1 readers apply
// nothing from it but still apply the head holding it (owner decision 164; §11.7).
message VersioningRules {
  repeated VersioningRule rules = 1;
}

message AuthorityProposal {            // the first counted signer, or the recovery key;
                                       // proposal_id = SHA-256(Signed AuthorityProposal)
  StatementHeader header = 1;
  uint32 statement_type = 2;           // SignedType
  bytes statement = 3;                 // that type's body
}

message AuthorityCosign {              // each further counted signer; a recovery key's restarts the window
  StatementHeader header = 1;
  bytes proposal_id = 2;
}

message RecoveryVeto {                 // an AdminSet member's admitted device, the subject's others included;
                                       // never the proposed device or a read_only one
  StatementHeader header = 1;
  bytes proposal_id = 2;
}

// One entry a config head holds (plan-TEAM-config-head-format #1): §7.9's BASE row has a head hold, as records,
// exactly the log's entries in (the previous base's folded_through, folded_through], each by id with the position
// of the entry that carried it, BASE entries included (DESIGN-DETAILS 5.2.3; question
// details-5-base-records-in-folds), so a reader holding the genesis recomputes A_1..A_ft from the head alone. A
// config file, which evs holds as ciphertext.
message ConfigRecord {
  bytes  id = 1;                       // SHA-256 of the Signed's signed bytes for a STATEMENT (StatementId) or a
                                       //   BASE; empty for a TICK
  uint64 n = 2;                        // the carrying entry's position
  int64  time_ms = 3;                  // the carrying entry's time
  uint32 kind = 4;                     // AuthEntry.kind: 1 BASE, its body the Signed ProjectionHeader; 2 STATEMENT;
                                       //   3 TICK
  bytes  body = 5;                     // AuthEntry.body verbatim
}

// fold/<d>/<i>, the i-th fold, i from 1 and d = i / 1024, each zero-padded to 8 digits: one file per head that
// advances folded_through, holding the records in (after, folded_through] in n order.
message ConfigFold {
  uint64 after = 1;                    // the previous fold's folded_through, 0 for the first
  uint64 folded_through = 2;
  repeated ConfigRecord records = 3;
}

// names: each sidecar's chosen client name (§7.7), which ConfigNames resolves to DNS labels keyed on the
// sidecar_id, duplicates taking -2, -3 in admission order. Deterministically encoded, in sidecar_id order.
message ConfigNameTable {
  repeated ConfigName names = 1;
}

message ConfigName {
  bytes  sidecar_id = 1;
  string name = 2;                     // a DNS label, as ValidateConfigClientName takes it
}
