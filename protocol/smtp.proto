// §14.5's preamble and proofs, which smtpedge sees (§2.8's smtp-1, smtp-2).
//
// The first four messages are §14's fenced blocks. SmtpOutcome and SmtpStatus take their fields from
// plan-SMTP-wire-gaps#1 and #2, and SmtpHandshake and SmtpHandshakeResult theirs from smtpproof-start-shts-wire,
// each decided with its numbers, and design_unfenced_test.go holds them until §14 fences them.
//
// Only SmtpPreamble and SmtpPreambleResult travel as frames ahead of the raw TLS (plan-SMTP-wire-gaps#3,
// smtp_frame.go). SmtpOutcome is a NO_REPLY envelope to the ticket's listener, SmtpProof and SmtpHandshake are
// RPCs to it, and SmtpStatus rides PushHint.hint on topic mail. No message here holds a oneof (§6.11).

syntax = "proto3";
package urnetwork.sidecar;

option go_package = "github.com/urnetwork/sidecar/protocol";

message SmtpPreamble {           // 0x1601, sidecar -> edge
  uint32 version = 1;
  string recipient_domain = 2;    // enforced: the edge resolves and dials it; every RCPT is at it (Z4)
  uint32 recipient_count = 3;     // proven (Z4); capped per message and per day (14.7)
  string message_id = 4;          // proven (Z5)
  string header_from_domain = 5;  // proven (Z5); in the network's zone (§15.9) or a verified Team domain (§7.6)
  string dkim_selector = 6;       // proven with d= (Z5)
  uint64 message_byte_count = 7;  // proven: BDAT's n, or DATA's octets before the end mark (Z4, Z6)
  bytes retry_of_send_id = 8;
  uint32 flags = 9;               // 1 BULK, 2 REQUIRETLS, 4 BURNER
}
message SmtpPreambleResult {     // 0x1602, edge -> sidecar
  uint32 code = 1;  // §6.11: 1 OK, 2 HALTED, 3 QUOTA, 4 DENIED, 5 NO_MX, 6 NO_TLS, 7 TRY_LATER;
                    //   0 UNSPECIFIED, a protocol error
  uint32 retry_after_ms = 2;
  bytes send_id = 3;
  string x_ur_ref = 4;            // issued; proven present (Z5)
  string feedback_id = 5;         // issued; proven present (Z5)
  string helo_name = 6;           // the sending address's PTR name (14.6)
  string mx_host = 7;
  bytes dnssec_chain = 8;         // MX, TLSA RRsets with RRSIGs (TL1)
  repeated string ehlo_keywords = 9;  // pre-TLS hints only; Z8 proves the post-TLS reply
}
message SmtpProof {              // 0x1605, RPC sidecar -> edge (M9)
  bytes send_id = 1;
  uint32 index = 2;               // 1 pi1; 2 pi2; 3 pi3; 4.. later DATA parts
  uint32 mode = 3;                // 1 BDAT, 2 DATA; fixed from pi2 on (Z9)
  uint64 first_record = 4;        // client application records covered,
  uint64 last_record = 5;         //   by TLS sequence number
  bytes proof = 6;
  bool last = 7;                  // covers octet n, the end mark (DATA) and QUIT
  uint64 server_record_count = 8; // server records after Finished that this and earlier parts cover (0 in
                                  //   pi1); this part covers those past the previous part's count (Z7)
  repeated bytes records = 9;     // ciphertext of each client record the part opens, in sequence order
                                  //   (BDAT's pi3: the head from first_record, then QUIT at last_record)
}
message SmtpProofResult {        // 0x1606, edge -> sidecar
  uint32 code = 1;                // §6.11: 1 OK; 2 INVALID, and the edge cuts the connection (14.7);
                                  //   0 UNSPECIFIED, a protocol error
}

message SmtpOutcome {            // 0x1603, sidecar -> edge, a NO_REPLY envelope to the ticket's listener
  bytes send_id = 1;              // the send it reports; the edge takes it from the connection's dialer for 15 min
                                  //   after the stream ends, and then drops it
  uint32 tls_level = 2;           // 1-4 for TL1-TL4, 0 if none was reached
  uint32 mode = 3;                // as SmtpProof.mode, 0 if the send ended before the mode was known
  repeated uint32 reply_codes = 4;  // the MX's reply codes, as the sidecar read them inside TLS
  uint32 dsn_count = 5;           // DSNs made or received since the last accepted outcome, so a late bounce rides
  uint32 hard_bounce_count = 6;   //   the next send
  bool downgrade_refused = 7;     // the send refused an MX below its pin, or at TL4 without an allowance
}                                 // self-reported: it only tightens (§14.8) and never feeds attribution

message SmtpStatus {             // 0x1604, in PushHint.hint on topic mail; smtpedge's halt job hints the clients
  uint32 kind = 1;                // SmtpStatusKind: 1 HALTED, 2 QUOTA, 3 CLEAR; 0 a protocol error (§6.11)
  uint32 retry_after_ms = 2;      // when the queue may try again; GET /smtp/status gives a halt's scope
}

message SmtpHandshake {          // 0x1607, RPC sidecar -> edge, TLS 1.3 only, as soon as the handshake ends
  bytes send_id = 1;
  bytes shts = 2;                 // the disclosed server handshake traffic secret (E2), which the edge forgets
}                                 //   once E2 has used it (D-SMTP-10)

message SmtpHandshakeResult {    // 0x1608, edge -> sidecar
  uint32 code = 1;                // SmtpHandshakeCode: 1 OK; 2 INVALID, and the edge ends the connection;
}                                 //   0 UNSPECIFIED, a protocol error

// SmtpPreambleResult.code, numbered by §6.11. A receiver takes 0 as a protocol error and resets the stream.
enum SmtpPreambleCode {
  SMTP_PREAMBLE_CODE_UNSPECIFIED = 0;
  SMTP_PREAMBLE_OK = 1;
  SMTP_PREAMBLE_HALTED = 2;
  SMTP_PREAMBLE_QUOTA = 3;
  SMTP_PREAMBLE_DENIED = 4;
  SMTP_PREAMBLE_NO_MX = 5;
  SMTP_PREAMBLE_NO_TLS = 6;
  SMTP_PREAMBLE_TRY_LATER = 7;
}

// SmtpProofResult.code, numbered by §6.11. A receiver takes 0 as a protocol error and resets the stream.
enum SmtpProofCode {
  SMTP_PROOF_CODE_UNSPECIFIED = 0;
  SMTP_PROOF_OK = 1;
  SMTP_PROOF_INVALID = 2;
}

// SmtpStatus.kind (plan-SMTP-wire-gaps#2). A client takes 0 as a protocol error and drops the hint.
enum SmtpStatusKind {
  SMTP_STATUS_KIND_UNSPECIFIED = 0;
  SMTP_STATUS_HALTED = 1;
  SMTP_STATUS_QUOTA = 2;
  SMTP_STATUS_CLEAR = 3;
}

// SmtpHandshakeResult.code (smtpproof-start-shts-wire). A receiver takes 0 as a protocol error and resets the
// stream.
enum SmtpHandshakeCode {
  SMTP_HANDSHAKE_CODE_UNSPECIFIED = 0;
  SMTP_HANDSHAKE_OK = 1;
  SMTP_HANDSHAKE_INVALID = 2;
}
