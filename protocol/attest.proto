// Attestation's wire (DESIGN-COMPUTE §5): what a device records of a pass it verified itself, and the policy's
// freshness tickets. AttestationResult is carried in the record's model_call and enclave entries (§6.8, §11.12) and
// in events, as the device that holds the plaintext wrote it; no server writes one, and no reader trusts one a server
// answered (R-ATTEST-1); the record reaches storage only as EVS ciphertext. A ticket is URnetwork's own signed file,
// the same bytes for every device and naming none, which ur.io serves and only devices decode (§5.4).

syntax = "proto3";
package urnetwork.sidecar;

option go_package = "github.com/urnetwork/sidecar/protocol";

// sidecar/protocol/attest.proto (§5.8): one verified pass, as the device that checked the evidence saw it.
message AttestationResult {
  string provider = 1;                 // "chutes"
  string label = 2;                    // "A1", "A2", "AP"
  string scheme = 3;                   // "chutes-e2e-v1"
  string cpu = 4;                      // "tdx" | "snp"
  string profile_id = 5;               // the policy profile matched
  string profile_review = 6;           // "reproduced" | "listed"
  string tcb = 7;                      // "UpToDate", or the SNP firmware level
  repeated string gpus = 8;            // "b200", ...
  uint64 policy_version = 9;
  bytes evidence_sha256 = 10;          // of the evidence as received
  bytes key_sha256 = 11;               // of the key bound
  string instance_id = 12;
  int64 verified_millis = 13;
  string verifier = 14;                // "ur 2027.1.3 / nras" | "ur … / local"
  string provider_model_id = 15;       // the id the policy pins for the model (Chutes: its chute_id)
}

// sidecar/protocol/attest.proto (§5.4's freshness tickets, compute-plan-ticket-distribution, QD-1379): one ticket of
// a sitting's batch, in deterministic protobuf, signed whole as the policy is, under the same namespace by the same
// certified key. Every bound is in UTC milliseconds and inside the signature. The device enforces §5.4's bounds
// whatever a ticket claims (attest_ticket.go).
message ComputePolicyTicketBatch {
  bytes batch_id = 1;                  // 16 random bytes, the sitting's batch
  int64 signed_at_ms = 2;              // the sitting
  int64 expires_ms = 3;                // at most signed_at_ms + 14 days; no ticket of the batch counts at or after it
}
message ComputePolicyTicket {
  uint32 format = 1;                   // 1
  ComputePolicyTicketBatch batch = 2;
  uint64 policy_version = 3;           // N: the device must hold policy version N or a later one
  int64 not_before_ms = 4;             // 00:00 UTC of its day, or signed_at_ms for a revocation batch's first
  int64 not_after_ms = 5;              // not_before_ms + 72 hours, cut to the batch's expires_ms
}
// What <base>/tickets/<day>.bin holds, and what a device keeps and passes on: the ticket's bytes exactly as signed,
// and the armored SSHSIG over them.
message ComputePolicyTicketFile {
  bytes ticket = 1;
  bytes signature = 2;
}
