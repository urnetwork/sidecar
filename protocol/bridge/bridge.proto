// §17's wire types: a sidecar role's compiled view for its device role (§18.6), the delegations and
// share certificates hosts verify, and §17.8's statements. Std and protobuf only (§4.4).
//
// §17.8 writes its statements as field lists without numbers. Those take numbers in the order written,
// and are open to review until they freeze. A statement a delta carries shows only ids, and the rest of
// its row rides sealed_body: readers open it, and no server sees a prefix, address, port, map, alias or
// share target (§2.8, §17.8, §17.9). Each *Body message below is what a sealed_body opens to. §17.8 names
// the seal but not its bytes, so sealed_body stays opaque here.

syntax = "proto3";
package urnetwork.sidecar;

import "protocol/bridge/auth.proto";
import "protocol/bridge/signed.proto";

option go_package = "github.com/urnetwork/sidecar/protocol/bridge";

message BridgeRows {                      // acl.proto's AclRows.bridge (§8)
  repeated BridgeEgressRow egress = 1;    // ids only
}

message BridgeEgressRow {
  bytes subject = 1;                      // sidecar_id or keyed atom
  BridgeEgressMode mode = 2;
}

// DeviceLocalRpc.SetBridgeState carries this, or it stays in process; auth only rises, and verified
// entries apply on top.
message BridgeState {
  AuthPin auth = 1;                        // the newest verified state; ApplyDeltas chains from it
  bytes genesis_sha256 = 2;                // the anchor (§7.9)
  bool has_document = 3;                   // that state's rows: enforcing{doc} or enforcing{nodoc}
  bytes rules = 4;                         // this device's compiled block, routes, maps and hook rules
  map<string, fixed32> names = 5;          // client name -> overlay IPv4 (§7.7, 17.4), versioned with rules
  repeated string name_zones = 6;          // <net>.<root>, and the alias zone where one is chosen (§12.9)
  repeated BridgeIdentity identities = 7;  // the subjects its rules let reach this host (17.9), ~64 B each
  repeated BridgeShareKey share_keys = 8;  // the shares this host serves (17.9)
  repeated string daemon_listeners = 9;    // rule 0 (17.6): the daemon's listener binds, host:port
}

message BridgeIdentity {
  bytes sidecar_id = 1;
  bytes identity_public_key = 2;
  uint64 admitted_at = 3;
  bool revoked = 4;
  bool suspended = 5;
}

message BridgeShareKey {                 // the pinned ShareKey, Ed25519
  bytes share_id = 1;
  bytes public_key = 2;
}

// legacy -> pending. The sidecar's id and identity key, stored with the anchor, are how the device role knows its own
// sign-out: only a Signed SidecarRevoke of that id, signed by that id under that key, wipes the posture back to legacy
// (plan-SDK-pending-sidecar-id). They travel in process or over the device RPC, never to a server.
message Pending {
  bytes network_id = 1;
  bytes genesis_sha256 = 2;
  bytes sidecar_id = 3;
  bytes identity_public_key = 4;         // Ed25519, 32 B
}

// BridgeState.rules, marshalled (plan-BRIDGE-small-readings #2): what a sidecar role compiled from verified config
// for its own device role, in process or over the device RPC and never to a server, so no §2.8 row. The device role
// validates it once, off the packet path, and refuses a malformed row or a field it does not know rather than skip
// it, since a newer compiler's row may narrow what it would otherwise open. Times are ms since the epoch, taken from
// the log and never a device clock, and 0 means none. Ids are 16 bytes, rule and grant ids 32, and identity keys
// Ed25519's 32. A drain runs from draining_since to drain_until, and the device role keeps a pinned pair or a flow
// past drain_until for as long as §17.5's idles say (600 s for TCP, 5 min otherwise, from draining_since).
message BridgeRules {
  BridgeIpv4Prefix block = 1;              // the network's /16 (§17.4); unset until a head carries one
  BridgeIpv4Prefix previous_block = 2;     // the block a change replaced, draining until previous_block_drain_until
  int64 previous_block_drain_until = 3;
  repeated fixed32 addresses = 4;          // this host's overlay /32s; one in previous_block drains with it
  repeated BridgeRuleEntry entries = 5;    // the sender's table (§17.5), one entry a prefix
  repeated BridgeRuleMap maps = 6;         // this host's maps (§17.6's rule 1)
  repeated BridgeRuleServed served = 7;    // the subnets and exit this host serves (rules 6 and 7)
  repeated BridgeRuleSubject subjects = 8; // who may reach this host and how (rules 1, 3, 4, 6 and 7)
  BridgeRuleEgress egress = 9;             // this device's own default route; unset keeps today's
}

enum BridgeRuleEntryKind {
  BRIDGE_RULE_ENTRY_KIND_UNSPECIFIED = 0;
  BRIDGE_RULE_ENTRY_KIND_LINK = 1;         // over its advertisers' links; with none left, a reject
  BRIDGE_RULE_ENTRY_KIND_UNASSIGNED = 2;   // block addresses nobody holds: unreachable
  BRIDGE_RULE_ENTRY_KIND_CARVED = 3;       // a local /32 the physical path needs: the default route (§17.4)
  BRIDGE_RULE_ENTRY_KIND_SERVICE = 4;      // a block's <block>.0.0/24, the resolver at <block>.0.53
}

// One prefix of the sender's table. An entry owns its range outright: with every advertiser down it answers
// unreachable, never a broader prefix or the default route (§17.7).
message BridgeRuleEntry {
  BridgeIpv4Prefix prefix = 1;
  BridgeRuleEntryKind kind = 2;
  repeated BridgeRuleLink links = 3;       // a link entry's advertisers, draining ones included
}

// An advertiser of an entry, or an exit: a link to its target (Q-BRIDGE-2).
message BridgeRuleLink {
  bytes target_client_id = 1;              // its current client, by §5's binding
  bytes target_sidecar_id = 2;
  bytes target_identity_public_key = 3;    // pinned through its SidecarAdmit
  bytes target_member_id = 4;              // the member whose device it is, which a MemberRevoke names; empty if tagged
  bytes rule_id = 5;                       // the BridgeRoute that advertises it; empty for an overlay address
  uint32 weight = 6;                       // its rendezvous weight (D-BRIDGE-9), at least 1
  bytes site_id = 7;
  int64 draining_since = 8;                // removed (§17.5's removed row): drains from here
  int64 drain_until = 9;
}

// A map this host holds (§17.6's rule 1, §17.8's BridgeMap): the destination as sent, mapped to target.
message BridgeRuleMap {
  bytes map_id = 1;                        // §17.8's rule id, which names its flows' rule tags
  BridgeIpv4Prefix match_prefix = 2;       // in the block; a range maps by offset
  uint32 protocol = 3;                     // 6, 17 or 1
  repeated BridgePortRange ports = 4;      // none: every port; an ICMP map has none
  bytes target = 5;                        // an address, 4 or 16 bytes
  uint32 target_port = 6;                  // 0 keeps the port; with one range, the range maps by offset
  int64 expires = 7;
  int64 draining_since = 8;
  int64 drain_until = 9;
}

// A prefix this host serves for an approved route (rule 6), or the exit an approved exit route makes it (rule 7).
message BridgeRuleServed {
  bytes route_id = 1;
  BridgeRouteKind kind = 2;
  BridgeIpv4Prefix prefix = 3;             // what it reaches; an exit's is 0.0.0.0/0
  BridgeIpv4Prefix exposed_prefix = 4;     // a remap: senders reach prefix as this range of the block, keeping host bits
  int64 draining_since = 5;
  int64 drain_until = 6;
}

// A subject its rules let reach this host, with its reach expanded from §8's rules and grants, so the hook needs no
// engine (plan-BRIDGE-small-readings #12). Its member and grant ids are here because a keyless device role applies
// MemberRevoke and GrantRevoke between states, and parses nothing else.
message BridgeRuleSubject {
  bytes sidecar_id = 1;
  bytes member_id = 2;                     // the member whose device it is; empty if tagged
  repeated bytes client_ids = 3;           // its current client and any bound in the last 7 days (plan-BRIDGE-subject-resolution)
  bool tagged = 4;
  repeated BridgeRuleReach dial = 5;       // this host's addresses and maps (rules 1 and 3)
  repeated BridgeRuleReach route = 6;      // the prefixes it serves (rule 6)
  repeated BridgeRuleReach exit = 7;       // public destinations through this host (rule 7)
}

// One row of a subject's reach. Protocol 0 reaches every protocol and port, and takes no ports; 6 or 17 with no
// ports, every port of it; ICMP has no port, so a row naming one never admits ICMP.
message BridgeRuleReach {
  bytes grant_id = 1;                      // the requested grant it comes from; empty for a policy rule
  BridgeIpv4Prefix prefix = 2;             // a route row's; unset on dial and exit rows
  uint32 protocol = 3;                     // 0, 1, 6 or 17
  repeated BridgePortRange ports = 4;
  int64 expires = 5;
}

// This device's own default route (§17.9's egress spec): today's under auto, only exits under exits, none under none.
message BridgeRuleEgress {
  BridgeEgressMode mode = 1;
  repeated BridgeRuleLink exits = 2;       // the approved exits it may use, under exits only
}

// §6.9 Signed, purpose window-delegation, SignedType 0x1908; by the subject's identity key or, on a share
// link, the ShareSigner its share_cert names (§17.9's share signers).
message WindowDelegation {
  bytes network_id = 1;                // the source network
  bytes subject_sidecar_id = 2;
  bytes window_client_id = 3;
  bytes window_client_public_key = 4;  // the window client's ClientKey public key
  bytes target_sidecar_id = 5;         // the host this link reaches
  int64 not_after_ms = 6;              // at most the window client's strict_exp (§7.4)
  bytes share_id = 7;                  // set for a cross-network share
  bytes share_cert = 8;                // with share_id: the Signed ShareCert below
}

message ShareCert {                    // §6.9 Signed, purpose window-delegation, SignedType 0x1909, by the ShareKey
  bytes share_id = 1;
  uint64 config_generation = 2;        // g, the source network's config generation (§10.5)
  bytes signer_public_key = 3;         // g's ShareSigner, Ed25519
  int64 not_after_ms = 4;              // at most 7 days after signing
}

message BridgeShareSigner {            // Y's config file per accepted share; sidecar roles only, not in BridgeState
  bytes share_id = 1;
  uint64 config_generation = 2;        // g, as in share_cert
  bytes signer_seed = 3;               // g's ShareSigner: a fresh 32-byte Ed25519 seed
  bytes share_cert = 4;                // its Signed ShareCert
}

message BridgeIpv4Prefix {
  fixed32 address = 1;                 // the network address, as BridgeState.names holds an IPv4
  uint32 length = 2;
}

message BridgePortRange {
  uint32 first = 1;
  uint32 last = 2;
}

// None under a standing grant (17.7), or the I-8 decisions and this use's CanonicalAction (§16.8), which
// readers verify as §8.8 does a GrantActivate's, the signer being every decision's requester.
message BridgeApproval {
  bytes canonical_action = 1;          // as stored, which every decision's payload_sha256 hashes
  repeated Signed decisions = 2;
}

// §6.9 Signed, purpose bridge, SignedType 0x1901 to 0x1907 in this order. BridgeBlock rides a head, so it
// carries no StatementHeader and no seal of its own; every other statement is a delta.
message BridgeBlock {                  // an admin
  BridgeIpv4Prefix ipv4_prefix = 1;
  BridgeIpv4Prefix previous_prefix = 2;
  int64 drain_until = 3;               // ms since the epoch
}

message BridgeAddress {                // the sidecar or an admin
  StatementHeader header = 1;
  bytes sidecar_id = 2;
  bytes sealed_body = 3;               // BridgeAddressBody
}

message BridgeAddressBody {
  fixed32 ipv4 = 1;
}

enum BridgeRouteKind {
  BRIDGE_ROUTE_KIND_UNSPECIFIED = 0;
  BRIDGE_ROUTE_KIND_SUBNET = 1;
  BRIDGE_ROUTE_KIND_EXIT = 2;
}

message BridgeRoute {                  // the advertiser; active once approved (17.7)
  StatementHeader header = 1;
  bytes route_id = 2;                  // 17.8's rule id
  bytes advertiser = 3;
  repeated bytes route_rule_ids = 4;   // the §8 route rules it serves, once approved
  bytes sealed_body = 5;               // BridgeRouteBody
}

message BridgeRouteBody {
  repeated BridgeIpv4Prefix prefixes = 1;
  BridgeIpv4Prefix exposed_prefix = 2;
  bytes site_id = 3;
  uint32 weight = 4;
  BridgeRouteKind kind = 5;
  uint32 drain_seconds = 6;
  BridgeApproval approval = 7;
}

message BridgeMap {                    // the host; active once approved (17.7)
  StatementHeader header = 1;
  bytes map_id = 2;                    // 17.8's rule id
  bytes host = 3;
  int64 expires = 4;                   // ms since the epoch
  bytes sealed_body = 5;               // BridgeMapBody
}

message BridgeMapBody {
  BridgeIpv4Prefix match_prefix = 1;
  uint32 protocol = 2;                 // the IP protocol number
  repeated BridgePortRange ports = 3;
  bytes target = 4;                    // the address, 4 or 16 bytes
  uint32 target_port = 5;
  uint32 drain_seconds = 6;
  BridgeApproval approval = 7;
}

enum BridgeEgressMode {
  BRIDGE_EGRESS_MODE_UNSPECIFIED = 0;
  BRIDGE_EGRESS_MODE_AUTO = 1;
  BRIDGE_EGRESS_MODE_EXITS = 2;
  BRIDGE_EGRESS_MODE_NONE = 3;
}

// A gate holds no config key, so it learns a mode from BridgeRows at the next base (§8.10, §17.8): until a
// writer folds this, a subject's new mode binds its readers and not the contract gate.
message BridgeEgress {                 // an admin, owner or sponsor
  StatementHeader header = 1;
  bytes subject = 2;
  bytes sealed_body = 3;               // BridgeEgressBody
}

message BridgeEgressBody {
  BridgeEgressMode mode = 1;
  repeated bytes exit_sidecar_ids = 2; // or exit_tag_id
  bytes exit_tag_id = 3;
}

// §17.9 seals a share's targets T_i, host included, under a key no server derives, and api-9 keeps both
// tables sealed, so all of the row rides the seal. No id-level check reads any of it: api and gates see a
// filing's kind, signer and header, and §17.8's gates never see aliases.
message BridgeAlias {                  // the accepting sidecar (17.9)
  StatementHeader header = 1;
  bytes sealed_body = 2;               // BridgeAliasBody
}

message BridgeAliasBody {
  bytes share_id = 1;
  uint32 target_index = 2;
  BridgeIpv4Prefix alias_prefix = 3;
  bytes host = 4;                      // sidecar_id: T_i's host, in the source network
}

enum BridgeWithdrawMode {
  BRIDGE_WITHDRAW_MODE_UNSPECIFIED = 0;
  BRIDGE_WITHDRAW_MODE_RESET = 1;
  BRIDGE_WITHDRAW_MODE_DRAIN = 2;
}

message BridgeWithdraw {               // the rule's signer or an admin; bodiless, so it never waits on a seal
  StatementHeader header = 1;
  bytes rule_id = 2;
  BridgeWithdrawMode mode = 3;
}
