# §22.8's fault schedule catalog and §23.6's gate map (D-TEST-10; TEST-M0-01): the one machine-readable
# copy that sidecartest/fault reads and that OPS-M1-07's gates.yml is generated from (C-18). A schedule
# registers against a case here with fault.Register, and fault.Missing lists what nothing covers.
# TestCatalogMatchesSection22 and TestCatalogMatchesGateMap hold this file to the design's own text, so
# a change to §22.8 or §23.6 that this file misses fails.
#
# invariants  FI-1 to FI-30: §22.8's name for each, and the task whose oracle answers it (base: the
#             running sidecartest base already holds it). That task binds the check with
#             fault.RegisterInvariant, so fault.FI(n) answers its check, and until it does fault.FI(n)
#             fails closed.
# rows        FS-1 to FS-125, each with §22.8's owning sections, checks (FI ids with their clause letter,
#             invariants, and named checks such as "hint SLO" and WK1-WK4) and tiers, and its cases.
# cases       the parts of a row a gate reports one by one, so a gate can report one part without
#             implying another (§23.6). The row's main part has no name; a later part has one.
#   gates     where the case must pass: Mn-out at milestone n's exit review, M6-in at M6's entry
#             (FS-46's escrow run on M4's build), every-out at each Gn-out (FS-55), next-cluster
#             before place_new names a new metadata cluster (§23.6's last row).
#   later_of  the case passes at the later of its gates, which §23.6 lists at both: "once M10's Gn-out
#             has passed" at the earlier gate, "unless M5's ... exit follows" at M10.
#   tiers     the case's tiers when narrower than its row's: a +T4 row's T4 is its app-host and wake
#             cases' (plan-TEST-small-readings reading 10), and a forged case runs on T2 alone.
#   forged    the server forges, withholds or forks state in the case, so it runs on T2 alone and its
#             twin, which must succeed, also runs on T3 (§22.8's cadence rule; reading 6 for FS-38,
#             FS-102 and FS-124, whose forging clauses are their own case). A row flag covers every
#             case of a T2 row.
#   open      what outside the build the case waits on: production, hardware or people. A gate reports
#             it open, never pass and never missing.
#   store_clock  a T3 case whose stored state ages across a clock move, so its run reads LastModified or
#             a Redis ttl that T3's store clock translates onto the schedule's clock (server/sidecart3/clock.go,
#             plan-TEST-clock-seam #2): server's RunRow runs a flagged case with the store clock and only a
#             flagged one, refuses FS-114 with it, and gate reports say "store clock translated". The cases
#             flagged are TEST-M2-07's reading of each row's clauses: the §11.13 age rules (evacuation, packing,
#             orphan GC, purges, the drop job's 25 h, a slot's 23 h), retention horizons and ttl'd soft state
#             past an Advance. A row whose T3 test finds otherwise changes its flag here.
# unknown     every write the row issues also runs with ApplyThenDrop (§22.8's unknown rule).
# fake_issuer the row's peers run on sidecartest's fake contract issuer or ControlId sink, so it names
#             T3 too, where a divergence from server's exchange fails (Q-TEST-1).
#
# Every value is the design's or this plan's reading of it: change a row through the design first,
# then here, and the tests say which side moved.

