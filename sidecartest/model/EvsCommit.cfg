\* §22.8's bounds: 2 writers, 2 evs instances, 1 ref in each mode, 3 paths, 2 segments, 2 generations
\* and 10 versions, with 96, 64, 63, 127 and 255 scaled to 3, 2, 5, 7 and 9. F2Run = "none" runs that
\* model; an M10 run names its story (F2Story) and runs on 2 instances with the M2 part held still.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Instances = {i1, i2}
    Segments = {s1, s2}
    MaxVersion = 10
    MaxPush = 14
    MaxAttempts = 3
    FoldTrigger = 3
    FoldSize = 2
    BaseRange = 5
    WindowLimit = 7
    WindowMax = 9
    MaxGeneration = 2
    MaxHour = 5
    MaxRefused = 8
    MaxFaults = 4
    Twin = "none"
    F2Run = "none"
    F2MaxHour = 4
    F2MaxFaults = 1
    F2MaxHolds = 1
INVARIANT
    TypeOk
    ClosureHolds
    AnswersDeleteNothing
    OutcomesHold
    NewestFound
    EntriesCommitted
    GcSafe
    FileCas
    VersionsRise
    PinsHold
    OneLadder
    LifecycleHolds
    GitTip
    ReadsServeNewest
    F2Closure
    F2DeletesKeepRules
    F2Cites
    F2FenceHolds
CHECK_DEADLOCK FALSE
