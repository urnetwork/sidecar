\* §22.8's bounds: three bucket lengths, three documents (one erased, one edited by diffs across a
\* boundary, one deleted while all holds its old row), a journaler and a backfiller of two slots each,
\* a merger, two rollers, an eraser and a finishing device. Supersede, RollupFence, MergeCompose and
\* KeepBase run their questions' first options: §11.14 as written ("index", "files", "newest", "all")
\* fails, as each question says.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1, r2}
    MaxSlots = 2
    MaxCrashes = 1
    MaxLapses = 1
    ForeignCuts = 1
    Documents = {"d1", "d2", "d3"}
    Events = 7
    Skew = TRUE
    Supersede = "content"
    RollupFence = "manifests"
    MergeCompose = "composable"
    KeepBase = "any"
    Still = {}
    Twin = "none"
SYMMETRY RollerSymmetry
INVARIANT
    TypeOk
    ResultsHold
    BucketsExact
    ChainsResolve
    OneVersionEach
    RollsOnce
    EpochHolds
    CutFences
    ErasedUnreadable
CHECK_DEADLOCK FALSE
