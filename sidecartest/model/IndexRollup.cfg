\* §22.8's bounds on DESIGN-DETAILS.md section 1's rules under owner decision 584's full entries: three
\* bucket lengths; three documents, d1 created, edited and erased, d2 edited four times, its full entries
\* large entries, and d3 created and deleted by a commit that skips the index while all may hold its old
\* row; a journaler and a backfiller of two slots each, one writer process dying with a push in flight; a
\* merger; two rollers with a crash and a lapse; an eraser and a finishing device; another erasure's CUT;
\* clocks skewed at window boundaries. The CUT lists d1 as its eraser read it when it built the CUT
\* (CutVersion "read"), so an edit may land between the two and stand; a CUT listing d1 as committed when
\* it lands ("commit") is run-tlc.sh's cut-commit ground.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1, r2}
    MaxSlots = 2
    MaxCrashes = 1
    MaxLapses = 1
    MaxRestarts = 1
    ForeignCuts = 1
    Documents = {"d1", "d2", "d3"}
    BigDocs = {"d2"}
    Events = 8
    Skew = TRUE
    CutVersion = "read"
    Still = {}
    Twin = "none"
SYMMETRY RollerSymmetry
INVARIANT
    TypeOk
    ResultsHold
    BucketsExact
    OneVersionEach
    RollsOnce
    EpochHolds
    CutFences
    ErasedUnreadable
CHECK_DEADLOCK FALSE
