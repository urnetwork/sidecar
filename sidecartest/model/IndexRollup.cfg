\* §22.8's bounds on DESIGN-DETAILS.md section 1's rules: three bucket lengths; three documents, d1
\* created, edited and erased, d2 edited four times by diffs where a base stands, its full entries large
\* entries, and d3 created and deleted by a commit that skips the index while all may hold its old row; a
\* journaler and a backfiller of two slots each, one writer process dying with a push in flight; a merger;
\* two rollers with a crash and a lapse; an eraser and a finishing device; another erasure's CUT; clocks
\* skewed at window boundaries. The CUT lists d1 as committed when it lands (CutVersion "commit"); a CUT
\* listing what its eraser read when it built ("read") breaks ChainsResolve, as question
\* search-m10-46-erased-base-of-a-live-diff says.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1, r2}
    MaxSlots = 2
    MaxCrashes = 1
    MaxLapses = 1
    MaxRestarts = 1
    ForeignCuts = 1
    Documents = {"d1", "d2", "d3"}
    BigDocs = {"d2"}
    Events = 8
    Skew = TRUE
    CutVersion = "commit"
    Still = {}
    Twin = "none"
SYMMETRY RollerSymmetry
INVARIANT
    TypeOk
    ResultsHold
    BucketsExact
    ChainsResolve
    OneVersionEach
    RollsOnce
    EpochHolds
    CutFences
    ErasedUnreadable
CHECK_DEADLOCK FALSE
