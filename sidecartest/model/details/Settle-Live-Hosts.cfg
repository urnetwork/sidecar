\* Settle.tla, the design: one write of either kind, a host failure and a coordinator crash: its key is
\* released once the host comes back and the settler has settled it (weak fairness). Liveness, so no symmetry
\* and no view.
SPECIFICATION LiveSpec
CONSTANTS
    DriveCount = 4
    DrivesPerHost = 2
    Writes = {w1}
    CoordinatorCount = 2
    HostFailures = 1
    CoordinatorCrashes = 1
    MaxPuts = 1
    MaxDeletes = 1
    Still = {"heal", "cancel"}
    Twin = "none"
PROPERTY
    HeldKeyReleased
CHECK_DEADLOCK FALSE
