\* EvsSlot.tla, the design: a window of 2 versions (file mode's 64), so a statement survives another commit, and
\* 3 ticks.
SPECIFICATION Spec
CONSTANTS
    Pushes = {p1, p2}
    Evacs = {e1}
    Window = 2
    MaxTime = 3
    EvacAge = 1
    MaxMoves = 1
    MaxCuts = 1
    MaxStalls = 1
    MaxCrashes = 0
    MaxConsumes = 1
    MaxRewrites = 0
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    TypeOk
    ClosureHolds
    OriginStands
    OneIntroducer
    StampHasRecord
    DeadIsFinal
CHECK_DEADLOCK FALSE
