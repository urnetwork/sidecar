\* IndexMerge.tla: IndexMerge-Slots's ground with the document's entries as large entries, each removed by its writer's next push once a merge has absorbed it. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 0
    Documents = {"d2"}
    BigDocs = {"d2"}
    Events = 4
    Skew = FALSE
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"rollup", "crash", "lapse", "tick", "marks"}
    Twin = "none"
INVARIANT
    TypeOk
    ResultsHold
    BucketsExact
    OneVersionEach
    RollsOnce
CHECK_DEADLOCK FALSE
