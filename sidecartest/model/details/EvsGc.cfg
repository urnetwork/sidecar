\* EvsGc.tla, the design (Twin none): GC, stalled writes, a new ref and DELETEs in one run. One segment id
\* uploaded up to twice, 2 pushes on a ref with a head and a ref with none, 1 GC run at a time, 2 stalled writes
\* (a head write or GC's DELETE), a paused attempt, a killed evacuation; a receipt lasts 2 ticks and a minute is
\* evacuated 3 ticks old. DESIGN-DETAILS.md section 2.3 records each run.
SPECIFICATION Spec
CONSTANTS
    Attempts = {a1, a2}
    Segments = {s1}
    Gcs = {g1}
    MaxTime = 7
    ReceiptLife = 2
    EvacAge = 3
    OrphanAge = 3
    MaxUploads = 2
    MaxStalls = 2
    MaxPauses = 1
    MaxCrashes = 1
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    TypeOk
    ClosureHolds
    GcSafe
    RecordsKept
    HeadsRise
CHECK_DEADLOCK FALSE
