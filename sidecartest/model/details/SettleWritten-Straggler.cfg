\* §19.6 as written, one PUT and one DELETE: the PUT's last drive commit, still on its way when the key was
\* released at a write quorum, lands on a drive the DELETE counted as lacking the key (found by this section).
SPECIFICATION Spec
CONSTANTS
    DriveCount = 4
    DrivesPerHost = 2
    Writes = {w1, w2}
    CoordinatorCount = 1
    HostFailures = 0
    CoordinatorCrashes = 0
    MaxPuts = 1
    MaxDeletes = 1
    Still = {"heal", "cancel"}
    Twin = "Written"
SYMMETRY WriteSymmetry
VIEW View
INVARIANT
    NoStaleQuorum
CHECK_DEADLOCK FALSE
