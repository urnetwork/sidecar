\* IndexMerge.tla: the design on one document edited four times in one bucket, by a journaler writing diffs on its own sealed slots and full copies and a backfiller writing full copies, with seals, slot reuse and merges (the ground of questions keep-base-full-copy and merge-stale-diff). See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 0
    Documents = {"d2"}
    BigDocs = {}
    Events = 4
    Skew = FALSE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"rollup", "crash", "lapse", "tick", "bfdiff", "marks"}
    Twin = "none"
INVARIANT
    TypeOk
    ResultsHold
    BucketsExact
    ChainsResolve
    OneVersionEach
    RollsOnce
CHECK_DEADLOCK FALSE
