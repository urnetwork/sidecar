\* Twin ClosureSkipsAbsorbed: no CLOSURE rewrites an absorbed slot, since a reader scans none. The slot still
\* holds the listed entry's bytes when the erasure ends.
SPECIFICATION SpecPath
CONSTANTS
    MaxVer = 2
    MaxSeals = 1
    MaxMerges = 1
    MaxReuses = 0
    MaxEntries = 1
    MaxErasures = 1
    Twin = "ClosureSkipsAbsorbed"
INVARIANT
    ErasedGone
CHECK_DEADLOCK FALSE
