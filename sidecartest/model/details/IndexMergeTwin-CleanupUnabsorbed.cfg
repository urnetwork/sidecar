\* IndexMerge.tla: Twin CleanupUnabsorbed: a writer's push removes a large entry of its own that no merge has absorbed. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 0
    Documents = {"d2", "d3"}
    BigDocs = {"d3"}
    Events = 2
    Skew = FALSE
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"rollup", "crash", "lapse", "tick", "marks"}
    Twin = "CleanupUnabsorbed"
INVARIANT
    TypeOk
    ResultsHold
CHECK_DEADLOCK FALSE
