    Pushes = {p1, p2}
    Evacs = {e1}
    Window = 1
    MaxTime = 1
    EvacAge = 2
    MaxMoves = 1
    MaxCuts = 1
    MaxStalls = 0
    MaxCrashes = 0
    MaxConsumes = 1
    MaxRewrites = 0
    Twin = "Landed"
SYMMETRY Symmetry
INVARIANT
    ConsumeKeeps
CHECK_DEADLOCK FALSE
