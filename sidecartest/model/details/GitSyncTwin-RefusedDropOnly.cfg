\* GitSync.tla: Twin RefusedDropOnly: a queued update evs can never take is dropped and the local ref left where it is. See DESIGN-DETAILS.md section 8.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Devices = {a, b}
    MaxCommits = 2
    MaxVer = 3
    MaxPid = 3
    MaxCrash = 0
    MaxCommitless = 0
    LocalFirst = TRUE
    AllowForce = FALSE
    Twin = "RefusedDropOnly"
SYMMETRY Symmetry
INVARIANT
    TypeOK
    Converge
CHECK_DEADLOCK FALSE
