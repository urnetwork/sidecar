\* Twin NoSettle: evacuation deletes a slot stored within the settle age, so the DELETE's second of slack takes
\* an object created after the HEAD. In QD-806's order one attempt never stores its slot after its own record, so
\* the late slot is a retry's: the statement's first attempt writes its slot and record and dies, its retry sleeps
\* before its slot round while evacuation deletes the first object, then stores it again within the second a stalled
\* run's HEAD reads; a killed run's restart deletes that one, and a later statement creates the id and commits.
SPECIFICATION Spec
CONSTANTS
    Pushes = {p1, p2}
    Evacs = {e1, e2}
    Window = 1
    MaxTime = 1
    EvacAge = 1
    MaxMoves = 0
    MaxCuts = 0
    MaxStalls = 0
    MaxCrashes = 1
    MaxConsumes = 0
    MaxRewrites = 0
    MaxRetries = 1
    Twin = "NoSettle"
SYMMETRY Symmetry
INVARIANT
    ClosureHolds
CHECK_DEADLOCK FALSE
