    Pushes = {p1, p2}
    Evacs = {e1, e2}
    Window = 1
    MaxTime = 2
    EvacAge = 1
    MaxMoves = 1
    MaxCuts = 0
    MaxStalls = 0
    MaxCrashes = 0
    MaxConsumes = 0
    MaxRewrites = 0
    Twin = "NoSettle"
SYMMETRY Symmetry
INVARIANT
    ClosureHolds
CHECK_DEADLOCK FALSE
