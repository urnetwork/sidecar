\* EvsSlot.tla, the design with a retry: NoSettle's twin's bounds under the design, a statement sent again after
\* its first attempt died, a stalled evacuation run beside its successor and a killed run, and a PATH_EPOCH commit
\* so a retoken may take over the dead statement's object while its retry runs; every invariant.
SPECIFICATION Spec
CONSTANTS
    Pushes = {p1, p2}
    Evacs = {e1, e2}
    Window = 1
    MaxTime = 1
    EvacAge = 1
    MaxMoves = 0
    MaxCuts = 1
    MaxStalls = 0
    MaxCrashes = 1
    MaxConsumes = 0
    MaxRewrites = 0
    MaxRetries = 1
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    TypeOk
    ClosureHolds
    OriginStands
    OneIntroducer
    StampHasRecord
    DeadIsFinal
CHECK_DEADLOCK FALSE
