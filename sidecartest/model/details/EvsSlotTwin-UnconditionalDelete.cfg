\* Twin UnconditionalDelete: evacuation's DELETE takes whatever object holds the key, so a stalled run deletes
\* the slot a later statement created after its successor deleted the dead one's.
SPECIFICATION Spec
CONSTANTS
    Pushes = {p1, p2}
    Evacs = {e1, e2}
    Window = 1
    MaxTime = 2
    EvacAge = 1
    MaxMoves = 1
    MaxCuts = 0
    MaxStalls = 0
    MaxCrashes = 0
    MaxConsumes = 0
    MaxRewrites = 0
    Twin = "UnconditionalDelete"
SYMMETRY Symmetry
INVARIANT
    ClosureHolds
CHECK_DEADLOCK FALSE
