\* RemoteCursor.tla: the design: three candidates, two of one time, one hit a page, one repeat a request, one erasure, one reopen. See DESIGN-DETAILS.md section 7.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    N = 3
    Time <- Times
    PageHits = 1
    MaxRetries = 1
    Twin = "none"
INVARIANT
    SpanSound
    NoInvention
    RepeatEqual
    NoLeak
CHECK_DEADLOCK FALSE
