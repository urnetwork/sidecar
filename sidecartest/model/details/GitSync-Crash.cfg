\* GitSync.tla: Twin none; a shared ref, two devices, two crashes. See DESIGN-DETAILS.md section 8.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Devices = {a, b}
    MaxCommits = 2
    MaxVer = 3
    MaxPid = 3
    MaxCrash = 2
    MaxCommitless = 1
    LocalFirst = FALSE
    AllowForce = FALSE
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    TypeOK MirrorExact NoDuplicate AckedDurable SharedSafe TruthfulNg NoSpurious Converge
CHECK_DEADLOCK FALSE
