\* IndexMerge.tla: all four grounds together: both documents, six commits, two writers writing diffs, a restart, merges, two rollers with a crash and a lapse, three windows with skew; by simulation. See DESIGN-DETAILS.md section 1.3 for the run it records.
\* tlc: -simulate num=40000 -depth 150 -seed 1
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1, r2}
    MaxSlots = 2
    MaxCrashes = 1
    MaxLapses = 1
    MaxRestarts = 1
    Documents = {"d2", "d3"}
    BigDocs = {}
    Events = 6
    Skew = TRUE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"marks"}
    Twin = "none"
SYMMETRY RollerSymmetry
INVARIANT
    TypeOk
    ResultsHold
    BucketsExact
    ChainsResolve
    OneVersionEach
    RollsOnce
CHECK_DEADLOCK FALSE
