\* IndexMerge.tla: the design on one document edited four times in one bucket, by a journaler and a backfiller with two slots each: seals, merges, an absorbed slot taken again and a writer out of slots that only appends. Every entry is full (owner decision 584), so a merge takes each as it stands. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 0
    Documents = {"d2"}
    BigDocs = {}
    Events = 4
    Skew = FALSE
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"rollup", "crash", "lapse", "tick", "marks"}
    Twin = "none"
INVARIANT
    TypeOk
    ResultsHold
    BucketsExact
    OneVersionEach
    RollsOnce
CHECK_DEADLOCK FALSE
