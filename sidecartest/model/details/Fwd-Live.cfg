\* Fwd.tla: the design where compiles go on running: every key the host admits is in the end S's live key. See DESIGN-DETAILS.md section 4.3 for the run it records.
SPECIFICATION LiveSpec
CONSTANTS
    MaxN = 3
    Keys = {1, 2}
    Slots = 1
    Rollbacks = FALSE
    Twin = "none"
INVARIANT
    OnlyLiveKeysAdmitted OverlayAfterState StaleIsAlarmed EachOverdueRaised
PROPERTY
    EventuallyRefused
CHECK_DEADLOCK FALSE
