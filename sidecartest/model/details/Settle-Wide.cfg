\* Settle.tla, the design at §22.8's bounds: 8 drives at EC:4 on 4 hosts, 3 writes, 2 coordinators, 2 host
\* failures, a crash, heal, cancels and a reader. By random simulation (run-settle.sh fixes the traces, depth
\* and seed), since its complete graph does not finish.
SPECIFICATION Spec
CONSTANTS
    DriveCount = 8
    DrivesPerHost = 2
    Writes = {w1, w2, w3}
    CoordinatorCount = 2
    HostFailures = 2
    CoordinatorCrashes = 1
    MaxPuts = 3
    MaxDeletes = 3
    Still = {}
    Twin = "none"
SYMMETRY WriteSymmetry
VIEW View
INVARIANT
    TypeOk
    NoStaleQuorum
    ReadsSeeCurrent
    LateWritesNeverRead
    RefusedNeverLands
    FailedDeleteSettled
CHECK_DEADLOCK FALSE
