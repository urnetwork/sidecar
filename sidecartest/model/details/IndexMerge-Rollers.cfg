\* IndexMerge.tla: the same ground with two rollers, one crash and one lapse of a live holder's lock. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1, r2}
    MaxSlots = 2
    MaxCrashes = 1
    MaxLapses = 1
    MaxRestarts = 0
    Documents = {"d3"}
    BigDocs = {}
    Events = 2
    Skew = TRUE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"marks"}
    Twin = "none"
SYMMETRY RollerSymmetry
INVARIANT
    TypeOk
    ResultsHold
    BucketsExact
    ChainsResolve
    OneVersionEach
    RollsOnce
CHECK_DEADLOCK FALSE
