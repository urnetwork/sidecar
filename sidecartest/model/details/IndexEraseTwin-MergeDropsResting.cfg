\* Twin MergeDropsResting: a merge after the CUT leaves out a diff whose base version the set lists though the
\* base stands, as evs_index_merge.go does on 2026-11-12, and absorbs its slot: until the eraser enters the
\* version nothing a reader scans holds it.
SPECIFICATION SpecPath
CONSTANTS
    MaxVer = 2
    MaxSeals = 2
    MaxMerges = 1
    MaxReuses = 0
    MaxEntries = 1
    MaxErasures = 1
    Twin = "MergeDropsResting"
INVARIANT
    Searchable
CHECK_DEADLOCK FALSE
