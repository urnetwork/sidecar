\* DropJob.tla, the design (Twin none): the drop job beside two pushes that may cite the listed version on
\* a cached head, adopt the candidate's bytes on a receipt, or carry them as a git-mode push's history segment,
\* on a ref with a head, a ref with none and the git-mode ref; 1 stalled head write (DropJob-Cite and
\* DropJob-Adopt run 2 and a paused attempt for one kind at a time). A receipt
\* lasts 3 ticks, a minute is evacuated 3 ticks old, a cached head hides the DROP for 2 ticks, and the job
\* waits the horizon past the time it saw the DROP by 2. DESIGN-DETAILS.md section 10.3 records each run.
SPECIFICATION Spec
CONSTANTS
    Attempts = {a1, a2}
    Kinds = {"cite", "adopt", "history"}
    MaxTime = 8
    ReceiptLife = 3
    EvacAge = 3
    CacheLife = 2
    CiteBound = 2
    OrphanAge = 4
    DropBy = 1
    MaxStalls = 1
    MaxPauses = 0
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    TypeOk
    ClosureHolds
    OnlyCandidates
    DeletesGated
    HeadsRise
CHECK_DEADLOCK FALSE
