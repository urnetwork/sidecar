\* IndexMerge.tla: Twin PromoteBlind: a promotion writes its target bucket's shard and manifest without replacing the versions it read. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 0
    Documents = {"d2", "d3"}
    BigDocs = {}
    Events = 3
    Skew = TRUE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"marks"}
    Twin = "PromoteBlind"
INVARIANT
    TypeOk
    ResultsHold
CHECK_DEADLOCK FALSE
