\* IndexMerge.tla: the design on one document created and then deleted by a commit that skips the index, across three windows with clocks skewed at a boundary: a journaled entry that trails, a backfilled tombstone, seals, merges and the roll-up of bucket 1 with its promotion (the ground of questions late-journal-tombstone and rollup-merge-race). See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 0
    Documents = {"d3"}
    BigDocs = {}
    Events = 2
    Skew = TRUE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"marks"}
    Twin = "none"
INVARIANT
    TypeOk
    ResultsHold
    BucketsExact
    ChainsResolve
    OneVersionEach
    RollsOnce
CHECK_DEADLOCK FALSE
