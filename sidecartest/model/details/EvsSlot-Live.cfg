\* EvsSlot.tla, the design: every record old enough to evacuate before the behavior ends leaves its batch, so a
\* slot never holds a minute back (weak fairness on the evacuator, stalled writes settling and time). Liveness,
\* so no symmetry.
SPECIFICATION LiveSpec
CONSTANTS
    Pushes = {p1, p2}
    Evacs = {e1}
    Window = 1
    MaxTime = 2
    EvacAge = 1
    MaxMoves = 1
    MaxCuts = 1
    MaxStalls = 1
    MaxCrashes = 1
    MaxConsumes = 1
    MaxRewrites = 0
    Twin = "none"
PROPERTY
    RecordsLeave
CHECK_DEADLOCK FALSE
