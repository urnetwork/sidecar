\* Reach: a card folded again after one erasure is listed by the next and folded again at the third epoch.
SPECIFICATION SpecCard
CONSTANTS
    MaxVer = 1
    MaxSeals = 1
    MaxMerges = 0
    MaxReuses = 0
    MaxEntries = 3
    MaxErasures = 2
    Twin = "none"
INVARIANT
    NeverTwice
CHECK_DEADLOCK FALSE
