\* EvsSlot.tla, the design with a retry at EvsSlot's bounds: 2 statements, 1 evacuation run, a window of 1 version,
\* 1 other commit, 1 PATH_EPOCH commit, 1 stalled head write, 1 killed run, 1 committed version removed with its
\* slot, 1 ERASE rewrite and 1 retry of a statement whose first attempt died; every invariant.
SPECIFICATION Spec
CONSTANTS
    Pushes = {p1, p2}
    Evacs = {e1}
    Window = 1
    MaxTime = 2
    EvacAge = 1
    MaxMoves = 1
    MaxCuts = 1
    MaxStalls = 1
    MaxCrashes = 1
    MaxConsumes = 1
    MaxRewrites = 1
    MaxRetries = 1
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    TypeOk
    ClosureHolds
    OriginStands
    OneIntroducer
    StampHasRecord
    DeadIsFinal
CHECK_DEADLOCK FALSE
