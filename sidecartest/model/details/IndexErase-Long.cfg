\* SpecPath, the design at wider bounds: d reaches version 6 through 4 seals, 3 merges and 3 reuses, beside 3
\* erasures.
SPECIFICATION SpecPath
CONSTANTS
    MaxVer = 6
    MaxSeals = 4
    MaxMerges = 3
    MaxReuses = 3
    MaxEntries = 1
    MaxErasures = 3
    Twin = "none"
INVARIANT
    PathTypeOk
    OwnBases
    Searchable
    ErasedGone
    Composable
CHECK_DEADLOCK FALSE
