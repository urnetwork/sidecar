\* CertOrder.tla: the design, two desktops and two rows of one host, three orders and six claims.
\* See DESIGN-DETAILS.md section 17.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Desktops = {d1, d2}
    Rows = {r1, r2}
    None = None
    MaxOrders = 3
    MaxClaims = 6
    Twin = "none"
INVARIANT
    TypeOk
    OneInFlight
    OneCert
    KeyMatch
    Tracked
    Served
    NoForeign
SYMMETRY Alike
CHECK_DEADLOCK FALSE
