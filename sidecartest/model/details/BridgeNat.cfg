\* BridgeNat.tla: the design on a daemon, whose judge applies every revocation as it arrives. See DESIGN-DETAILS.md section 12.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Rules = {r1}
    Flows = {f1, f2}
    MaxLog = 3
    MaxCompiles = 2
    MaxRestarts = 1
    Judge = TRUE
    Twin = "none"
INVARIANT
    TypeOK
    DialFence
    NoStaleFlow
    PolicySound
    FlowSound
CHECK_DEADLOCK FALSE
