\* GitSync.tla: Twin none; an owned ref's histories diverge and a conflict branch is made: the invariant must fail. See DESIGN-DETAILS.md section 8.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Devices = {a, b}
    MaxCommits = 2
    MaxVer = 3
    MaxPid = 3
    MaxCrash = 0
    MaxCommitless = 0
    LocalFirst = TRUE
    AllowForce = FALSE
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    NoConflict
CHECK_DEADLOCK FALSE
