\* Twin NoBlock: a builder that applied an ERASE whose CUT has not landed folds without the entry, at a version
\* another builder wrote with it.
SPECIFICATION SpecCard
CONSTANTS
    MaxVer = 1
    MaxSeals = 0
    MaxMerges = 0
    MaxReuses = 0
    MaxEntries = 2
    MaxErasures = 1
    Twin = "NoBlock"
INVARIANT
    CopiesEqual
CHECK_DEADLOCK FALSE
