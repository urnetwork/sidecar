\* GitSync.tla: Twin NoApplyLock: sync settles the local ref without the ref's lock, around a receive. See DESIGN-DETAILS.md section 8.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Devices = {a, b}
    MaxCommits = 2
    MaxVer = 3
    MaxPid = 3
    MaxCrash = 0
    MaxCommitless = 0
    LocalFirst = TRUE
    AllowForce = FALSE
    Twin = "NoApplyLock"
SYMMETRY Symmetry
INVARIANT
    TypeOK
    AckedDurable
CHECK_DEADLOCK FALSE
