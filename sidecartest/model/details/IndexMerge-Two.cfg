\* IndexMerge.tla: the design on both documents, three commits, every process and one roller across three windows. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 0
    Documents = {"d2", "d3"}
    BigDocs = {}
    Events = 3
    Skew = TRUE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"marks"}
    Twin = "none"
INVARIANT
    TypeOk
    ResultsHold
    BucketsExact
    ChainsResolve
    OneVersionEach
    RollsOnce
CHECK_DEADLOCK FALSE
