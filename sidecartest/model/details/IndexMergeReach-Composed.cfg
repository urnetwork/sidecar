\* IndexMerge.tla: Reach: a merge composes a sealed diff, resting on a slot its writer keeps, that is its document's newest settled entry. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 3
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 0
    Documents = {"d2"}
    BigDocs = {}
    Events = 3
    Skew = FALSE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"rollup", "crash", "lapse", "tick", "bfdiff"}
    Twin = "none"
INVARIANT
    NeverComposed
CHECK_DEADLOCK FALSE
