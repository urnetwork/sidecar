\* Settle.tla, the design: 3 writes, two PUTs and one DELETE: a create, an overwrite and a DELETE, with the
\* create's last commit free to land after either.
SPECIFICATION Spec
CONSTANTS
    DriveCount = 4
    DrivesPerHost = 2
    Writes = {w1, w2, w3}
    CoordinatorCount = 1
    HostFailures = 0
    CoordinatorCrashes = 0
    MaxPuts = 2
    MaxDeletes = 1
    Still = {"heal", "cancel"}
    Twin = "none"
SYMMETRY WriteSymmetry
VIEW View
INVARIANT
    TypeOk
    NoStaleQuorum
    ReadsSeeCurrent
    LateWritesNeverRead
    RefusedNeverLands
    FailedDeleteSettled
CHECK_DEADLOCK FALSE
