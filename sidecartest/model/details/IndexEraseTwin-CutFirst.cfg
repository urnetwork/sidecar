\* Twin CutFirst: the CUT precedes the ERASE of the body, so a builder at the new epoch still opens the entry.
SPECIFICATION SpecCard
CONSTANTS
    MaxVer = 1
    MaxSeals = 0
    MaxMerges = 0
    MaxReuses = 0
    MaxEntries = 1
    MaxErasures = 1
    Twin = "CutFirst"
INVARIANT
    Fence
CHECK_DEADLOCK FALSE
