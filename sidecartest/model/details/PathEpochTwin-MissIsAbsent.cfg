\* PathEpoch.tla: Twin MissIsAbsent: a reader with no floor takes a current-epoch miss as absence while sources stand. See DESIGN-DETAILS.md section 9.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Paths = {"x"}
    Clients = {a, b}
    Mappers = {m}
    MaxEpoch = 2
    MaxVersion = 3
    MaxSources = 3
    NewRef = FALSE
    Twin = "MissIsAbsent"
SYMMETRY Symmetry
INVARIANT
    TypeOK
    ReadsNewest
CHECK_DEADLOCK FALSE
