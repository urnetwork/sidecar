\* Twin PendingStaysOnAbsentHead: evacuation leaves a pending record on a ref with no head where it is, as
\* the landed draft does (question evsb-m2-11-pending-record-no-head). Liveness, so no symmetry.
SPECIFICATION LiveSpec
CONSTANTS
    Attempts = {a1}
    Segments = {s1}
    Gcs = {g1}
    MaxTime = 5
    ReceiptLife = 2
    EvacAge = 3
    OrphanAge = 3
    MaxUploads = 1
    MaxStalls = 1
    MaxPauses = 1
    MaxCrashes = 1
    Twin = "PendingStaysOnAbsentHead"
PROPERTY
    RecordsLeave
CHECK_DEADLOCK FALSE
