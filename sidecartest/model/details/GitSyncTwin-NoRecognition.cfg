\* GitSync.tla: Twin NoRecognition: the daemon takes its own committed push for another's commit. See DESIGN-DETAILS.md section 8.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Devices = {a}
    MaxCommits = 1
    MaxVer = 2
    MaxPid = 2
    MaxCrash = 0
    MaxCommitless = 0
    LocalFirst = FALSE
    AllowForce = FALSE
    Twin = "NoRecognition"
SYMMETRY Symmetry
INVARIANT
    TypeOK
    TruthfulNg
CHECK_DEADLOCK FALSE
