\* BridgeVoid.tla: the design over four entries and two generations, a third that never forms, two writers with waits of 1 and 2, no grace and no clock skew. See DESIGN-DETAILS.md section 12.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    MaxLog = 4
    MaxGen = 2
    MaxTime = 2
    Wait1 = 1
    Wait2 = 2
    Grace = 0
    Skew = 0
    Twin = "none"
INVARIANT
    TypeOK
    NoFork
    Equal
    FoldedStays
    NoPendingRow
    Bounded
    VoidsAgree
    HonestValid
CHECK_DEADLOCK FALSE
