\* AuthLog.tla: Twin VoidKeepsProposal at K = 1 (TEAM-M2-05). A cascade's void that leaves open a proposal its voided key
\* signed lets another key activate it, breaking VoidsCloseProposals.
SPECIFICATION Spec
CONSTANTS
    MaxN = 7
    MaxBases = 1
    K = 1
    Window = 8
    TailMax = 8
    RecoveryWindow = 2
    Life = 5
    MaxAdmits = 2
    Adversary = FALSE
    LyingWriter = FALSE
    Narrow = FALSE
    Story <- StoryVoidKeeps
    Twin = "VoidKeepsProposal"
INVARIANT
    VoidsCloseProposals
CHECK_DEADLOCK FALSE
