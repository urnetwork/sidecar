\* EvsSlot.tla, the design (Twin none): 2 statements that list the one slot id, 1 evacuation run at a time, a
\* window of 1 version (git mode), 1 other commit, 1 PATH_EPOCH commit, 1 stalled head write, 1 killed
\* evacuation, 1 committed version removed with its slot and 1 ERASE rewrite; a minute is evacuated 1 tick old.
\* DESIGN-DETAILS.md section 14.3 records each run.
SPECIFICATION Spec
CONSTANTS
    Pushes = {p1, p2}
    Evacs = {e1}
    Window = 1
    MaxTime = 2
    EvacAge = 1
    MaxMoves = 1
    MaxCuts = 1
    MaxStalls = 1
    MaxCrashes = 1
    MaxConsumes = 1
    MaxRewrites = 1
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    TypeOk
    ClosureHolds
    OriginStands
    OneIntroducer
    StampHasRecord
    DeadIsFinal
CHECK_DEADLOCK FALSE
