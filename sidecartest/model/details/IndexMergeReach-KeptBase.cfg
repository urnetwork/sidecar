\* IndexMerge.tla: Reach: a head holds a diff whose base sits in a file a merge has absorbed and its writer still keeps. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 0
    Documents = {"d2"}
    BigDocs = {}
    Events = 4
    Skew = FALSE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"rollup", "crash", "lapse", "tick", "bfdiff", "marks"}
    Twin = "none"
INVARIANT
    NeverKeptBase
CHECK_DEADLOCK FALSE
