\* GitSync.tla: Twin NgOnUnknown: an unknown outcome is answered as a non-fast-forward. See DESIGN-DETAILS.md section 8.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Devices = {a}
    MaxCommits = 1
    MaxVer = 2
    MaxPid = 2
    MaxCrash = 0
    MaxCommitless = 0
    LocalFirst = FALSE
    AllowForce = FALSE
    Twin = "NgOnUnknown"
SYMMETRY Symmetry
INVARIANT
    TypeOK
    TruthfulNg
CHECK_DEADLOCK FALSE
