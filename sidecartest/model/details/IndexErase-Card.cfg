\* IndexErase.tla, SpecCard, the design (Twin none): a stream of 3 entries, the card projected by its writer and
\* a backfiller, 2 seals of a head, and 2 erasures, each destroying its entry before its CUT.
SPECIFICATION SpecCard
CONSTANTS
    MaxVer = 1
    MaxSeals = 2
    MaxMerges = 0
    MaxReuses = 0
    MaxEntries = 3
    MaxErasures = 2
    Twin = "none"
INVARIANT
    CardTypeOk
    Fence
    CardGone
    CopiesEqual
    CardStands
CHECK_DEADLOCK FALSE
