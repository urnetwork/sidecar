\* Probe: an ERASE rewrite that drops the origin. The slot is then no statement's: evacuation keeps it and no
\* push takes it, so nothing is lost; the design keeps the origin so that the object still says who made it.
SPECIFICATION Spec
CONSTANTS
    Pushes = {p1, p2}
    Evacs = {e1}
    Window = 1
    MaxTime = 2
    EvacAge = 1
    MaxMoves = 1
    MaxCuts = 1
    MaxStalls = 1
    MaxCrashes = 1
    MaxConsumes = 1
    MaxRewrites = 1
    Twin = "RewriteDropsOrigin"
SYMMETRY Symmetry
INVARIANT
    TypeOk
    ClosureHolds
    OneIntroducer
    StampHasRecord
    DeadIsFinal
CHECK_DEADLOCK FALSE
