\* DropJob.tla, the design: two pushes that adopt the candidate's bytes, as an entry or as a git-mode push's
\* history segment, and 2 stalled head writes.
SPECIFICATION Spec
CONSTANTS
    Attempts = {a1, a2}
    Kinds = {"adopt", "history"}
    MaxTime = 8
    ReceiptLife = 3
    EvacAge = 3
    CacheLife = 2
    CiteBound = 2
    OrphanAge = 4
    DropBy = 1
    MaxStalls = 2
    MaxPauses = 1
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    TypeOk
    ClosureHolds
    OnlyCandidates
    DeletesGated
    HeadsRise
CHECK_DEADLOCK FALSE
