\* RemoteAsk.tla: the design with three own indexers and one other member's over two repos: only the warm two are asked at once. See DESIGN-DETAILS.md section 7.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Repos <- SmallRepos
    Owner <- TheOwner
    Shared <- TheShared
    Idx <- ThreeIdx
    Member <- TheMember
    Scope <- TheScope
    Reads <- TheReads
    Rank <- TheRank
    Me = "me"
    Twin = "none"
INVARIANT
    Reach
    OwnerBound
    OneOther
    TwoAtOnce
    WarmFirst
    OneServes
    ServedByLive
    OwnModeQuiet
CHECK_DEADLOCK FALSE
