    MaxVer = 1
    MaxSeals = 0
    MaxMerges = 0
    MaxReuses = 0
    MaxEntries = 2
    MaxErasures = 1
    Twin = "SeqVersion"
INVARIANT
    Fence
CHECK_DEADLOCK FALSE
