\* PathEpoch.tla: Twin NoNewNameRule: a writer tokenizes a new name under an epoch it knows a newer generation for. See DESIGN-DETAILS.md section 9.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Paths = {"x"}
    Clients = {a}
    Mappers = {m}
    MaxEpoch = 2
    MaxVersion = 2
    MaxSources = 3
    NewRef = FALSE
    Twin = "NoNewNameRule"
INVARIANT
    TypeOK
    NoLateToken
CHECK_DEADLOCK FALSE
