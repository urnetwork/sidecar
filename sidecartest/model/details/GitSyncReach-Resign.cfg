\* GitSync.tla: Twin none; a push whose head moved only by a commitless version is signed again and lands: the invariant must fail. See DESIGN-DETAILS.md section 8.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Devices = {a}
    MaxCommits = 1
    MaxVer = 3
    MaxPid = 3
    MaxCrash = 0
    MaxCommitless = 1
    LocalFirst = FALSE
    AllowForce = FALSE
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    NeverResigned
CHECK_DEADLOCK FALSE
