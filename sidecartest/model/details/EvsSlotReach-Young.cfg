\* Reach: a dead statement's slot stored within the settle age is kept. In QD-806's order that slot is a retry's:
\* the first attempt's record is evacuated and its object deleted while the retry sleeps before its slot round, and
\* the run killed after that DELETE meets, on its restart, the object the retry stored again in the same tick.
