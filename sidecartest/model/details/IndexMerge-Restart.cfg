\* IndexMerge.tla: the design with the journaler's process dying with a push in flight that still lands: one document edited three times in one bucket. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 1
    Documents = {"d2"}
    BigDocs = {}
    Events = 3
    Skew = FALSE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"backfill", "rollup", "crash", "lapse", "tick", "marks"}
    Twin = "none"
INVARIANT
    TypeOk
    ResultsHold
    BucketsExact
    ChainsResolve
    OneVersionEach
    RollsOnce
CHECK_DEADLOCK FALSE
