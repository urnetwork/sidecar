\* IndexMerge.tla: the design with a writer's process dying with a push in flight that still lands: both documents, four commits in one bucket, both writers writing diffs. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 1
    Documents = {"d2", "d3"}
    BigDocs = {}
    Events = 4
    Skew = FALSE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"rollup", "crash", "lapse", "tick", "marks"}
    Twin = "none"
INVARIANT
    TypeOk
    ResultsHold
    BucketsExact
    ChainsResolve
    OneVersionEach
    RollsOnce
CHECK_DEADLOCK FALSE
