\* §19.6 as written, one PUT and one DELETE, with every write's commits held to its key's hold
\* (NoLateWriteCommits), so that only a heal's commit arrives late: a heal that read a drive lacking the key
\* lands its copy there after a DELETE counted that drive (found by this section).
SPECIFICATION Spec
CONSTANTS
    DriveCount = 4
    DrivesPerHost = 2
    Writes = {w1, w2}
    CoordinatorCount = 1
    HostFailures = 0
    CoordinatorCrashes = 0
    MaxPuts = 1
    MaxDeletes = 1
    Still = {"cancel"}
    Twin = "Written"
SYMMETRY WriteSymmetry
VIEW View
INVARIANT
    NoStaleQuorum
ACTION_CONSTRAINT NoLateWriteCommits
CHECK_DEADLOCK FALSE
