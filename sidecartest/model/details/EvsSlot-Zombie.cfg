\* EvsSlot.tla, the design: a stalled evacuation run beside its successor, each holding its own HEAD of the slot.
SPECIFICATION Spec
CONSTANTS
    Pushes = {p1, p2}
    Evacs = {e1, e2}
    Window = 1
    MaxTime = 2
    EvacAge = 1
    MaxMoves = 1
    MaxCuts = 1
    MaxStalls = 0
    MaxCrashes = 0
    MaxConsumes = 1
    MaxRewrites = 0
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    TypeOk
    ClosureHolds
    OriginStands
    OneIntroducer
    StampHasRecord
    DeadIsFinal
CHECK_DEADLOCK FALSE
