\* Reach: 14.5's first leak in QD-806's order (QD-870): an attempt stops between its slot round and its record and
\* its statement is never sent again, so its slot stands under its origin past the age at which evacuation judges a
\* record, and no batch holds one.
SPECIFICATION Spec
CONSTANTS
    Pushes = {p1}
    Evacs = {e1}
    Window = 1
    MaxTime = 2
    EvacAge = 1
    MaxMoves = 1
    MaxCuts = 0
    MaxStalls = 0
    MaxCrashes = 0
    MaxConsumes = 0
    MaxRewrites = 0
    MaxRetries = 0
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    NeverLeaks
CHECK_DEADLOCK FALSE
