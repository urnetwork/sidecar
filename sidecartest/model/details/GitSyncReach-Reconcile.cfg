\* GitSync.tla: Twin none; a daemon killed after evs's commit and before its local update reconciles: the invariant must fail. See DESIGN-DETAILS.md section 8.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Devices = {a, b}
    MaxCommits = 2
    MaxVer = 3
    MaxPid = 3
    MaxCrash = 1
    MaxCommitless = 0
    LocalFirst = FALSE
    AllowForce = FALSE
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    NeverReconciled
CHECK_DEADLOCK FALSE
