\* BridgeNat.tla: the design with two rules, so a close of one rule runs beside flows of the other. See DESIGN-DETAILS.md section 12.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Rules = {r1, r2}
    Flows = {f1, f2}
    MaxLog = 3
    MaxCompiles = 1
    MaxRestarts = 1
    Judge = TRUE
    Twin = "none"
INVARIANT
    TypeOK
    DialFence
    NoStaleFlow
    PolicySound
    FlowSound
CHECK_DEADLOCK FALSE
