\* IndexMerge.tla: Twin ReuseUnabsorbed: a seal reuses a slot no merge has absorbed. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 0
    Documents = {"d2", "d3"}
    BigDocs = {}
    Events = 2
    Skew = FALSE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"rollup", "crash", "lapse", "tick", "bfdiff", "marks"}
    Twin = "ReuseUnabsorbed"
INVARIANT
    TypeOk
    ResultsHold
CHECK_DEADLOCK FALSE
