\* Settle.tla, the design: two DELETEs, whose keys rule (3) holds longest: every held key is released once
\* its stalled commits answer (weak fairness). Liveness, so no symmetry and no view.
SPECIFICATION LiveSpec
CONSTANTS
    DriveCount = 4
    DrivesPerHost = 2
    Writes = {w1, w2}
    CoordinatorCount = 1
    HostFailures = 0
    CoordinatorCrashes = 0
    MaxPuts = 0
    MaxDeletes = 2
    Still = {"heal", "cancel"}
    Twin = "none"
PROPERTY
    HeldKeyReleased
CHECK_DEADLOCK FALSE
