\* Settle.tla, the design: every held key is released once its stalled commits answer and its hosts come
\* back (weak fairness), at Settle.cfg's bounds. Liveness, so no symmetry and no view.
SPECIFICATION LiveSpec
CONSTANTS
    DriveCount = 4
    DrivesPerHost = 2
    Writes = {w1, w2}
    CoordinatorCount = 1
    HostFailures = 0
    CoordinatorCrashes = 0
    MaxPuts = 2
    MaxDeletes = 2
    Still = {"heal", "cancel"}
    Twin = "none"
PROPERTY
    HeldKeyReleased
CHECK_DEADLOCK FALSE
