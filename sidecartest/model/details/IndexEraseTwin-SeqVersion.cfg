\* Twin SeqVersion: the card version is the stream version alone and the CUT lists the version its eraser read
\* (RECORD.md 7.4 and §16.8 as written). The card folded again has the listed version: design-problems.md 15,
\* second failure.
SPECIFICATION SpecCard
CONSTANTS
    MaxVer = 1
    MaxSeals = 0
    MaxMerges = 0
    MaxReuses = 0
    MaxEntries = 2
    MaxErasures = 1
    Twin = "SeqVersion"
INVARIANT
    CardStands
CHECK_DEADLOCK FALSE
