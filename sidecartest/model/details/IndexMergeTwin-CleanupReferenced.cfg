\* IndexMerge.tla: Twin CleanupReferenced: a writer removes an absorbed large entry that a diff in its unabsorbed slots still rests on. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 0
    Documents = {"d2"}
    BigDocs = {"d2"}
    Events = 4
    Skew = FALSE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"rollup", "crash", "lapse", "tick", "bfdiff", "marks"}
    Twin = "CleanupReferenced"
INVARIANT
    TypeOk
    ChainsResolve
CHECK_DEADLOCK FALSE
