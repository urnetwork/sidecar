\* EvsSlot.tla, the design: 3 statements list the one slot id, so two may take over one dead statement's object
\* at once.
SPECIFICATION Spec
CONSTANTS
    Pushes = {p1, p2, p3}
    Evacs = {e1}
    Window = 1
    MaxTime = 2
    EvacAge = 1
    MaxMoves = 0
    MaxCuts = 1
    MaxStalls = 0
    MaxCrashes = 0
    MaxConsumes = 0
    MaxRewrites = 0
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    TypeOk
    ClosureHolds
    OriginStands
    OneIntroducer
    StampHasRecord
    DeadIsFinal
CHECK_DEADLOCK FALSE
