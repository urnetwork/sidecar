\* PathEpoch.tla: Twin StaleFirstPush: a push planned on a ref with no head commits on a ref that has since got one. See DESIGN-DETAILS.md section 9.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Paths = {"x"}
    Clients = {a, b}
    Mappers = {m}
    MaxEpoch = 2
    MaxVersion = 3
    MaxSources = 3
    NewRef = TRUE
    Twin = "StaleFirstPush"
SYMMETRY Symmetry
INVARIANT
    TypeOK
    NoLostUpdate
CHECK_DEADLOCK FALSE
