\* IndexMerge.tla: Twin NoOwnCas: a push that seals does not replace its writer's head, so two pushes of one writer built on one base both commit. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 1
    Documents = {"d2"}
    BigDocs = {}
    Events = 3
    Skew = FALSE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"backfill", "rollup", "crash", "lapse", "tick", "marks"}
    Twin = "NoOwnCas"
INVARIANT
    TypeOk
    ChainsResolve
CHECK_DEADLOCK FALSE
