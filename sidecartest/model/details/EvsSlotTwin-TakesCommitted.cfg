\* Twin TakesCommitted: a takeover that does not look for its statement in the head, and deletes the slot of a
\* push that committed before the cut-over.
SPECIFICATION Spec
CONSTANTS
    Pushes = {p1, p2}
    Evacs = {e1}
    Window = 1
    MaxTime = 2
    EvacAge = 1
    MaxMoves = 0
    MaxCuts = 1
    MaxStalls = 0
    MaxCrashes = 0
    MaxConsumes = 0
    MaxRewrites = 0
    Twin = "TakesCommitted"
SYMMETRY Symmetry
INVARIANT
    ClosureHolds
CHECK_DEADLOCK FALSE
