\* RemoteAsk.tla: the design under LiveSpec, on the smaller network (two repos, two own indexers, one other member's): every repo settles. See DESIGN-DETAILS.md section 7.3 for the run it records.
SPECIFICATION LiveSpec
CONSTANTS
    Repos <- SmallRepos
    Owner <- TheOwner
    Shared <- TheShared
    Idx <- SmallIdx
    Member <- TheMember
    Scope <- TheScope
    Reads <- TheReads
    Rank <- TheRank
    Me = "me"
    Twin = "none"
INVARIANT
    Reach
    OwnerBound
    OneOther
    ServedByLive
    OwnModeQuiet
PROPERTY
    Settles
CHECK_DEADLOCK FALSE
