\* EvsGc.tla, the design: two GC runs alive at once, a stalled one beside its successor, with the segment
\* uploaded again between them.
SPECIFICATION Spec
CONSTANTS
    Attempts = {a1, a2}
    Segments = {s1}
    Gcs = {g1, g2}
    MaxTime = 6
    ReceiptLife = 2
    EvacAge = 3
    OrphanAge = 3
    MaxUploads = 2
    MaxStalls = 1
    MaxPauses = 1
    MaxCrashes = 0
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    TypeOk
    ClosureHolds
    GcSafe
    RecordsKept
    HeadsRise
CHECK_DEADLOCK FALSE
