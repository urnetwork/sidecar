\* EvsGc.tla, the design: 10 ticks, long enough for a segment to be uploaded, orphaned, deleted, uploaded again,
\* adopted and evacuated.
SPECIFICATION Spec
CONSTANTS
    Attempts = {a1, a2}
    Segments = {s1}
    Gcs = {g1}
    MaxTime = 10
    ReceiptLife = 2
    EvacAge = 3
    OrphanAge = 3
    MaxUploads = 2
    MaxStalls = 1
    MaxPauses = 0
    MaxCrashes = 0
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    TypeOk
    ClosureHolds
    GcSafe
    RecordsKept
    HeadsRise
CHECK_DEADLOCK FALSE
