\* SpecCard, the design at wider bounds: a stream of 4 entries, 3 seals and 3 erasures.
SPECIFICATION SpecCard
CONSTANTS
    MaxVer = 1
    MaxSeals = 3
    MaxMerges = 0
    MaxReuses = 0
    MaxEntries = 4
    MaxErasures = 3
    Twin = "none"
INVARIANT
    CardTypeOk
    Fence
    CardGone
    CopiesEqual
    CardStands
CHECK_DEADLOCK FALSE
