\* Settle.tla, the design (Twin none): 4 drives on 2 hosts, read at 2 and written at 3; 2 writes of either kind,
\* 1 coordinator, a reader; commits stall, deadlines pass, reverts land. DESIGN-DETAILS.md section 2.3 records
\* each run.
SPECIFICATION Spec
CONSTANTS
    DriveCount = 4
    DrivesPerHost = 2
    Writes = {w1, w2}
    CoordinatorCount = 1
    HostFailures = 0
    CoordinatorCrashes = 0
    MaxPuts = 2
    MaxDeletes = 2
    Still = {"heal", "cancel"}
    Twin = "none"
SYMMETRY WriteSymmetry
VIEW View
INVARIANT
    TypeOk
    NoStaleQuorum
    ReadsSeeCurrent
    LateWritesNeverRead
    RefusedNeverLands
    FailedDeleteSettled
CHECK_DEADLOCK FALSE
