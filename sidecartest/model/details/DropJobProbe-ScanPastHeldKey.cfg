\* Probe ScanPastHeldKey: the scans read past a held key, with two pushes that cite or hold a receipt and 2
\* stalled head writes. The design's invariants still hold, since the
\* horizon already waited for every record a held write can belong to: the scans' wait on a held key is the
\* store's and adds no fence.
SPECIFICATION Spec
CONSTANTS
    Attempts = {a1, a2}
    Kinds = {"cite", "adopt"}
    MaxTime = 8
    ReceiptLife = 3
    EvacAge = 3
    CacheLife = 2
    CiteBound = 2
    OrphanAge = 4
    DropBy = 1
    MaxStalls = 2
    MaxPauses = 0
    Twin = "ScanPastHeldKey"
SYMMETRY Symmetry
INVARIANT
    TypeOk
    ClosureHolds
    OnlyCandidates
    DeletesGated
    HeadsRise
CHECK_DEADLOCK FALSE
