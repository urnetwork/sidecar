\* Probe ScanPastHeldKey: the scans read past a held key. The design run's invariants still hold, since the
\* horizon already waited for every record a held write can belong to: the scans' wait on a held key is the
\* store's and adds no fence.
SPECIFICATION Spec
CONSTANTS
    Attempts = {a1, a2}
    Kinds = {"cite", "adopt", "history"}
    MaxTime = 8
    ReceiptLife = 3
    EvacAge = 3
    CacheLife = 2
    CiteBound = 2
    OrphanAge = 4
    DropBy = 1
    MaxStalls = 1
    MaxPauses = 1
    Twin = "ScanPastHeldKey"
SYMMETRY Symmetry
INVARIANT
    TypeOk
    ClosureHolds
    OnlyCandidates
    DeletesGated
    HeadsRise
CHECK_DEADLOCK FALSE
