\* GitSync.tla: Twin none; an owned ref whose clients may force. See DESIGN-DETAILS.md section 8.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Devices = {a, b}
    MaxCommits = 3
    MaxVer = 4
    MaxPid = 4
    MaxCrash = 1
    MaxCommitless = 0
    LocalFirst = TRUE
    AllowForce = TRUE
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    TypeOK MirrorExact NoDuplicate AckedDurable SharedSafe TruthfulNg NoSpurious Converge
CHECK_DEADLOCK FALSE
