\* Twin KeepResting: a CLOSURE takes the listed entries and leaves a diff that rests on one, whose removed keys
\* and its version own set give the erased set back.
SPECIFICATION SpecPath
CONSTANTS
    MaxVer = 2
    MaxSeals = 1
    MaxMerges = 0
    MaxReuses = 0
    MaxEntries = 1
    MaxErasures = 1
    Twin = "KeepResting"
INVARIANT
    ErasedGone
CHECK_DEADLOCK FALSE
