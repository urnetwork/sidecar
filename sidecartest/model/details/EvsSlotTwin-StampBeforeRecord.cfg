\* Twin StampBeforeRecord: the slots before the record, so a killed attempt leaves a slot no record lists.
SPECIFICATION Spec
CONSTANTS
    Pushes = {p1}
    Evacs = {e1}
    Window = 1
    MaxTime = 2
    EvacAge = 1
    MaxMoves = 0
    MaxCuts = 0
    MaxStalls = 0
    MaxCrashes = 0
    MaxConsumes = 0
    MaxRewrites = 0
    Twin = "StampBeforeRecord"
SYMMETRY Symmetry
INVARIANT
    StampHasRecord
CHECK_DEADLOCK FALSE
