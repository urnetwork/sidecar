\* Twin TakesUnsettled: a takeover that does not wait out the settle age, so a second one's DELETE, in its
\* second of slack, takes the object the first created.
SPECIFICATION Spec
CONSTANTS
    Pushes = {p1, p2, p3}
    Evacs = {e1}
    Window = 1
    MaxTime = 2
    EvacAge = 1
    MaxMoves = 0
    MaxCuts = 1
    MaxStalls = 0
    MaxCrashes = 0
    MaxConsumes = 0
    MaxRewrites = 0
    Twin = "TakesUnsettled"
SYMMETRY Symmetry
INVARIANT
    OriginStands
CHECK_DEADLOCK FALSE
