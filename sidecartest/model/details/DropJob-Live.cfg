\* DropJob.tla, the design: every job that starts with room for its waits ends done (weak fairness on the job,
\* the evacuator, stalled writes settling and time). Liveness, so no symmetry.
SPECIFICATION LiveSpec
CONSTANTS
    Attempts = {a1}
    Kinds = {"cite", "adopt", "history"}
    MaxTime = 8
    ReceiptLife = 3
    EvacAge = 3
    CacheLife = 2
    CiteBound = 2
    OrphanAge = 4
    DropBy = 1
    MaxStalls = 1
    MaxPauses = 1
    Twin = "none"
PROPERTY
    JobEnds
CHECK_DEADLOCK FALSE
