\* IndexMerge.tla: the design on one document edited twice across three windows with skew, the journaler's entries beside the backfiller's full copies, merges and the roll-up. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 0
    Documents = {"d2"}
    BigDocs = {}
    Events = 2
    Skew = TRUE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"marks", "bfdiff"}
    Twin = "none"
INVARIANT
    TypeOk
    ResultsHold
    BucketsExact
    ChainsResolve
    OneVersionEach
    RollsOnce
CHECK_DEADLOCK FALSE
