SPECIFICATION Spec
CONSTANTS
    MaxGen = 3
    MaxTime = 5
    Life = 2
    MaxFiles = 3
    RogueHolder = TRUE
    Twin = "none"
INVARIANT
    NoRogueAdmitted
CHECK_DEADLOCK FALSE
