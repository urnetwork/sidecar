\* PathEpoch.tla: Twin none; a path created in epoch 1 ends in epoch 3 with its sources dropped: the invariant must fail. See DESIGN-DETAILS.md section 9.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Paths = {"x"}
    Clients = {a}
    Mappers = {m}
    MaxEpoch = 3
    MaxVersion = 5
    MaxSources = 3
    NewRef = FALSE
    Twin = "none"
INVARIANT
    NeverTwoCutOvers
CHECK_DEADLOCK FALSE
