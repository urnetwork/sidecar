\* GitSync.tla: Twin none; a shared ref, two devices, one crash, one commitless version. See DESIGN-DETAILS.md section 8.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Devices = {a, b}
    MaxCommits = 3
    MaxVer = 4
    MaxPid = 4
    MaxCrash = 1
    MaxCommitless = 1
    LocalFirst = FALSE
    AllowForce = FALSE
    Twin = "none"
SYMMETRY Symmetry
INVARIANT
    TypeOK MirrorExact NoDuplicate AckedDurable SharedSafe TruthfulNg NoSpurious Converge
CHECK_DEADLOCK FALSE
