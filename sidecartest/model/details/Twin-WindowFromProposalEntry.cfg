\* AuthLog.tla: Twin WindowFromProposalEntry at K = 2 (TEAM-M2-05). A window run from the proposal's entry, not its newest
\* recovery signature, activates before a late recovery cosign's 72 h and breaks WindowHolds.
SPECIFICATION Spec
CONSTANTS
    MaxN = 5
    MaxBases = 1
    K = 2
    Window = 4
    TailMax = 4
    RecoveryWindow = 2
    Life = 5
    MaxAdmits = 2
    Adversary = FALSE
    LyingWriter = FALSE
    Narrow = FALSE
    Story <- StoryWindowEntry
    Twin = "WindowFromProposalEntry"
INVARIANT
    WindowHolds
CHECK_DEADLOCK FALSE
