\* PrefixRules.tla: Twin RepairSkipsNames: a repair writes content and no row, so a head reader that starts after it still lists the path as the ignored delta left it. See DESIGN-DETAILS.md section 16.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    MaxLog = 1
    MaxRef = 3
    RuleSets = {"inOnly"}
    Honest = {"A"}
    Twin = "RepairSkipsNames"
INVARIANT
    ListingAfterRepair
CHECK_DEADLOCK FALSE
