\* Settle.tla, the design: 2 coordinators, one host failure and one coordinator crash, which the settler settles.
SPECIFICATION Spec
CONSTANTS
    DriveCount = 4
    DrivesPerHost = 2
    Writes = {w1, w2}
    CoordinatorCount = 2
    HostFailures = 1
    CoordinatorCrashes = 1
    MaxPuts = 2
    MaxDeletes = 2
    Still = {"heal", "cancel"}
    Twin = "none"
SYMMETRY WriteSymmetry
VIEW View
INVARIANT
    TypeOk
    NoStaleQuorum
    ReadsSeeCurrent
    LateWritesNeverRead
    RefusedNeverLands
    FailedDeleteSettled
CHECK_DEADLOCK FALSE
