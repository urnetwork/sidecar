\* PrefixRules.tla: Twin NoNewRefFence: evs takes any pin on the push that creates the ref, so a new ref is judged under an older set than the newest the log held when evs committed it. See DESIGN-DETAILS.md section 16.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    MaxLog = 1
    MaxRef = 1
    RuleSets = {"closed"}
    Honest = {"A"}
    Twin = "NoNewRefFence"
INVARIANT
    NewRefFence
CHECK_DEADLOCK FALSE
