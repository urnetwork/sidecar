\* IndexMerge.tla: Twin NoPromote: a roll-up drops a tombstone it carries though a newer bucket holds an older entry of its document. See DESIGN-DETAILS.md section 1.3 for the run it records.
SPECIFICATION Spec
CONSTANTS
    Journaler = wa
    Backfiller = wb
    Rollers = {r1}
    MaxSlots = 2
    MaxCrashes = 0
    MaxLapses = 0
    MaxRestarts = 0
    Documents = {"d3"}
    BigDocs = {}
    Events = 2
    Skew = TRUE
    Bases = "own"
    KeepBase = "any"
    MergeCompose = "composable"
    Supersede = "content"
    Step4 = "promote"
    RollupFence = "manifests"
    Life = "short"
    Still = {"marks"}
    Twin = "NoPromote"
INVARIANT
    TypeOk
    ResultsHold
CHECK_DEADLOCK FALSE
