\* EvsGc.tla, the design: every record old enough to evacuate before the behavior ends leaves its batch
\* (weak fairness on the evacuator, stalled writes settling and time). Liveness, so no symmetry.
SPECIFICATION LiveSpec
CONSTANTS
    Attempts = {a1}
    Segments = {s1}
    Gcs = {g1}
    MaxTime = 5
    ReceiptLife = 2
    EvacAge = 3
    OrphanAge = 3
    MaxUploads = 1
    MaxStalls = 1
    MaxPauses = 1
    MaxCrashes = 1
    Twin = "none"
PROPERTY
    RecordsLeave
CHECK_DEADLOCK FALSE
