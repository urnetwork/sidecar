\* Settle.tla, the design: 6 drives on 3 hosts, read at 3 and written at 4.
SPECIFICATION Spec
CONSTANTS
    DriveCount = 6
    DrivesPerHost = 2
    Writes = {w1, w2}
    CoordinatorCount = 1
    HostFailures = 0
    CoordinatorCrashes = 0
    MaxPuts = 2
    MaxDeletes = 2
    Still = {"heal", "cancel"}
    Twin = "none"
SYMMETRY WriteSymmetry
VIEW View
INVARIANT
    TypeOk
    NoStaleQuorum
    ReadsSeeCurrent
    LateWritesNeverRead
    RefusedNeverLands
    FailedDeleteSettled
CHECK_DEADLOCK FALSE
