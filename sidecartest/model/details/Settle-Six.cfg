\* Settle.tla, the design: 6 drives on 3 hosts, read at 3 and written at 4; 2 writes of either kind, 2
\* coordinators, a host failure, a crash, heal and cancels. By random simulation, since its complete graph
\* does not finish.
SPECIFICATION Spec
CONSTANTS
    DriveCount = 6
    DrivesPerHost = 2
    Writes = {w1, w2}
    CoordinatorCount = 2
    HostFailures = 1
    CoordinatorCrashes = 1
    MaxPuts = 2
    MaxDeletes = 2
    Still = {}
    Twin = "none"
SYMMETRY WriteSymmetry
VIEW View
INVARIANT
    TypeOk
    NoStaleQuorum
    ReadsSeeCurrent
    LateWritesNeverRead
    RefusedNeverLands
    FailedDeleteSettled
CHECK_DEADLOCK FALSE
