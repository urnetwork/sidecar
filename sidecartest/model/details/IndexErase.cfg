\* IndexErase.tla, SpecPath, the design (Twin none): d reaches version 4 through 3 seals, 2 merges and 2 reuses of
\* an absorbed slot, beside 2 erasures whose CUTs list what their eraser read. DESIGN-DETAILS.md section 15.3
\* records each run.
SPECIFICATION SpecPath
CONSTANTS
    MaxVer = 4
    MaxSeals = 3
    MaxMerges = 2
    MaxReuses = 2
    MaxEntries = 1
    MaxErasures = 2
    Twin = "none"
INVARIANT
    PathTypeOk
    OwnBases
    Searchable
    ErasedGone
    Composable
CHECK_DEADLOCK FALSE
