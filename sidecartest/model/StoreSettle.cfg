\* §22.8's first breadth-first run, as DESIGN-DETAILS.md 2.6 bounds it on details/Settle.tla's configurations: one
\* key on 4 drives on 2 hosts, 2 writes of either kind, 2 coordinators, a host failure, a coordinator crash the
\* settler settles, and a reader; heal and cancels are held still here and run in run-tlc.sh's design grounds,
\* which also carry §22.8's wider runs, since its 8 drives and 3 writes do not finish breadth-first.
SPECIFICATION Spec
CONSTANTS
    DriveCount = 4
    DrivesPerHost = 2
    Writes = {w1, w2}
    CoordinatorCount = 2
    HostFailures = 1
    CoordinatorCrashes = 1
    MaxPuts = 2
    MaxDeletes = 2
    Still = {"heal", "cancel"}
    Twin = "none"
SYMMETRY WriteSymmetry
VIEW View
INVARIANT TypeOk NoStaleQuorum ReadsSeeCurrent LateWritesNeverRead RefusedNeverLands FailedDeleteSettled
CHECK_DEADLOCK FALSE
