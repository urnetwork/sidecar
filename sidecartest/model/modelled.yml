# What each TLA+ model models, in code (TEST-M2-08; D-TEST-10, D-PHASE-7, FI-30). §22.8's cadence runs
# the model checks "at each Gn-out of a milestone that changes a modelled object": a gate reruns a
# model's TLC checks when any of its sources changed since its newest passing run here, and lets that
# run stand when none did. modelled_test.go reads this file and holds its globs to real files;
# model_test.go, under sidecar_tlc, decides each gate's rerun and prints the run line to add here.
#
# models        one per spec in this directory.
#   spec        EvsCommit, StoreSettle or IndexRollup.
#   owners      the tasks that write the model.
#   milestones  the gates whose freeze needs it passing (§22.10).
#   objects     what the model keeps, as §22.8 lists it.
#   companions  models of the same objects under details/, as §22.8's row names them beside the spec,
#               each run by its own script there: details/IndexMerge.tla is DESIGN-DETAILS.md section
#               1's, holding its rules beside §11.14's as written. A companion's spec, its cfgs and its
#               script count among the sources, so a change to either model reruns the spec at a gate.
#   sources     globs from the monoroot, the directory holding this repository and its siblings, of the
#               files that implement what the model keeps: a change to any forces a rerun at a gate.
#               Test files never count. The spec, its cfg and run-tlc.sh count too.
#   exclude     globs the sources match that belong to another model.
#   runs        each recorded TLC run, newest last.
#     at        yyyy-mm-dd
#     commit    the sidecar commit
#     tlc       TLC's revision, as its banner prints it
#     mode      model, mutants, live or stories, as run-tlc.sh's modes
#     result    pass or fail
#     sources_sha256  the digest of the sources when it ran, as modelled_test.go computes it
#     states, depth, seconds  what TLC reported, summed over the mode's runs
#
# details       one per model of DESIGN-DETAILS.md that stands alone under details/: no spec in this
#               directory keeps its objects, so it is no spec's companion, and its own run script is its
#               check. At a gate, model_test.go runs each group of the script whose newest passing run is
#               not at the model's sources, and the gate fails, naming the model not run, where the owner's
#               tla2tools.jar is missing; a merge, and make check, run none.
#   model       details/<Name>, whose spec is details/<Name>.tla.
#   run         its script under details/, run as <run> <track> <group>, which runs the owner's TLC
#               (ROOT/.stack/tools/tlc, ROOT being the script's own) and keeps TLC's state under
#               ROOT/.stack/scratch by the track's name: design, the configurations that must pass; twins,
#               each of which must end with the invariant its cfg names violated; and reach, each of which
#               must reach the state its cfg's last invariant denies.
#   owners, milestones, objects, sources, exclude and runs as a model's. The spec, its cfgs and its run
#               script count among the sources, and every glob matches a file. A run's mode is the group it
#               ran, its tlc the revision the script's verdict lines name, and its states and depth what
#               those lines report, summed and at most.

