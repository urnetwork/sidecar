layouts:
  repo/ format: 2
  segment header format: 2
  kind-5 segment header bytes: 48
  kind-5 segment push_id offset: 32
  kind-5 general records offset: 120
  staged segment max padded bytes: 16384
  batch header format: 2
  batch record format: 2
  batch record format byte: 1
  batch record tail items: 2
  purge list max ids: 2048
  drop max paths: 1024
  drop max listed versions: 1048576
  drop window ms: 604800000
  window bit versionless replaced: 4
  window bit drop: 5

vectors:
  testdata/evs/format2/segment_vectors.json:
    random_seed: "cryptotest's seed the bytes come from"
    repo_id: "hex, 16 B"
    generation: "the segments' generation"
    fek_key: "hex, fek of that generation"
    manifest_key: "hex, manifest of that generation"
    file_id: "hex, 16 B, every record's"
    push_id: "hex, 16 B, the push every header names"
    segments: "each kind-5 segment: name, segment hex, id, padded_size, length, staged, place {offset, length, body_length}, content_sha256, and a slot-keyed one's slot_id and slot"
  testdata/evs/format2/batch_vectors.json:
    batches: "each batch: name, instance, minute, seq, created_ms, records {type, format, repo_id, ref_id, push_id, signer_sidecar_id, time_ms, body, staged, purge_list, offset, length}, and bytes"
    windows: "each window entry: name, its 64 bytes hex, flags, and its bits 4 and 5 as read"
    staged: "each staged framing: name, its bytes hex, and its segments"
  testdata/evs/format2/drop_vectors.json:
    cases: "each DROP: name, its EvsPush's bytes (push), body and lists hex, the lists' slices over parts when split (slices), and want: ok or the refusal code's name"
    membership: "each question EvsDropLists answers of the first case's body: epoch, token_path, version, removal, and the index of the path listing it, or -1"
  testdata/evs/citation/:
    name: "the case"
    citations: "each new version: token_path, version, and its path's base version or null; a version is {versioning, chain [{kind, id, staged}], slot_ids}"
    sources: "staged and versionless_uploads ids; removed [{token_path, version}]; reuse [{ref_id, token_path, version}]"
    want: "ok, or the refusal code's name"
  testdata/evs/purge/:
    name: "the case"
    replaced: "each replaced version: token_path and version"
    push_versions: "every new version of the push, as citation's versions"
    room_byte_count: "what the record has left for its list"
    want: "the EvsPurgeList, as hex of its deterministic bytes"
