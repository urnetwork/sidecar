# Format 2's schema (EVS-FORMAT.md's format 2 chapter; EVS2-M10-01), which M10's entry review reads beside the bytes
# its vectors pin (§22.10, D-PHASE-7). Format 2 only adds: no number format 1 declared at M2 moves, and format 1's
# refusals stay what they were (D-PHASE-9). Read strictly, so a key this header does not name fails.
#
# messages   format 2's own messages, each field as "number name type" in declaration order
# enums      format 2's own enums, each value as "number NAME" in declaration order
# relies_on  format 1's declarations format 2 gives meaning to, by number: testdata/evs/reserved_numbers.yml's fields
#            and values, all of them, and what else format 2's codecs read
# layouts    format 2's numbers in fixed layouts, which the root's codecs hold to this list
# vectors    each format-2 vector file and its top-level keys, with what each holds
#
# protocol/evs_format2_descriptor_test.go holds messages, enums and relies_on to evs.proto's descriptors and to
# reserved_numbers.yml; the root's evs_format2_codec_test.go holds layouts and vectors to the codecs and files.

messages:
  EvsPurgeList:
    - 1 candidates repeated EvsPurgeCandidate
    - 2 marked bool
  EvsPurgeCandidate:
    - 1 token_path repeated bytes
    - 2 replaced_version uint64
    - 3 segment_ids repeated bytes
    - 4 staged_segment_ids repeated bytes
    - 5 slot_ids repeated bytes
  EvsDropStatus:
    - 1 drop_id bytes
    - 2 ref_id bytes
    - 3 push_id bytes
    - 4 version uint64
    - 5 not_before_ms int64
    - 6 state EvsDropState
    - 7 phase EvsDropPhase
    - 8 progress uint64
    - 9 progress_total uint64
    - 10 reason EvsDropRefusal
    - 11 freed_bytes uint64
    - 12 preview_id bytes
  EvsDropsReply:
    - 1 drops repeated EvsDropStatus
  EvsDropPreviewRequest:
    - 1 ref_id bytes
    - 2 paths repeated EvsDropPath
  EvsDropPreviewReply:
    - 1 preview_id bytes
    - 2 state EvsDropPreviewState
    - 3 progress uint64
    - 4 progress_total uint64
    - 5 paths repeated EvsDropPreviewPath
    - 6 freed_bytes uint64
    - 7 shared_bytes uint64
    - 8 inline_bytes uint64
    - 9 packed_bytes uint64
    - 10 young_bytes uint64
    - 11 snapshot_version uint64
    - 12 snapshot_ms int64
  EvsDropPreviewPath:
    - 1 list_match bool
    - 2 count uint32

enums:
  EvsDropState:
    - 0 EVS_DROP_STATE_UNSPECIFIED
    - 1 EVS_DROP_PENDING
    - 2 EVS_DROP_CANCELLED
    - 3 EVS_DROP_EXECUTING
    - 4 EVS_DROP_DONE
    - 5 EVS_DROP_REFUSED
    - 6 EVS_DROP_OBSERVED
  EvsDropPhase:
    - 0 EVS_DROP_PHASE_UNSPECIFIED
    - 1 EVS_DROP_RESOLVE
    - 2 EVS_DROP_MARK
    - 3 EVS_DROP_VERIFY
    - 4 EVS_DROP_DELETE
  EvsDropRefusal:
    - 0 EVS_DROP_REFUSAL_UNSPECIFIED
    - 1 EVS_DROP_REFUSAL_LOCKED
    - 2 EVS_DROP_REFUSAL_MISMATCH
    - 3 EVS_DROP_REFUSAL_VERIFY
  EvsDropPreviewState:
    - 0 EVS_DROP_PREVIEW_STATE_UNSPECIFIED
    - 1 EVS_DROP_PREVIEW_QUEUED
    - 2 EVS_DROP_PREVIEW_RUNNING
    - 3 EVS_DROP_PREVIEW_DONE
    - 4 EVS_DROP_PREVIEW_FAILED

