# The protocol/evs.proto fields no design fence prints, for I-18: each field's number and type, which pin what
# EVS-FORMAT.md proposes, and the §2.8 row that shows it. `sees` quotes that row, so a row that stops saying it fails.
# A field a row does not yet name says so under `pending`, with what asks for it: those wait on a design-records edit
# of the row (questions/evs1-m2-01-metadata-rows.md), never on the field, and each stays visible here until the row
# names it. The fenced messages' fields are testdata/metadata/fields.yml's, but for the three the owner's answers add.

