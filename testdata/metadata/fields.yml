# The map behind §22.7's schema guard (I-18), sidecar's half: what proves every server-visible proto
# field, object family and Redis family is in §2.8's list, and every live row is backed. Read by
# sidecartest/schema_guard.go, as strictly as the list.
#
# A new field on a message below fails until it has a line, and its row comes first: a row changes only
# through the design, so a value with no row is a question, never a line in open with no question
# behind it. Keys are Message.field, names without their package.
#
#   landed           the newest milestone whose exit has passed; each gate's sweep raises it
#   pending_until    the milestone whose exit a pending line must be settled by, unless it names its own
#   key_sources      globs holding key builders, besides every <svc>service
#   roots            messages a server decodes or builds, each with where the design says so
#   seals            sealed bytes on such a message, each with what it opens to: the walk stops there,
#                    and the field itself still needs a row, since its ciphertext shows
#   sealed_messages  messages no root reaches and no seal names, each with why no server reads one
#   sealed_files     files whose messages stay sealed unless a root reaches them
#   fields           every reached field, with its row
#   unset            reached fields that stay empty on whatever a server reads
#   open             reached fields no row names yet: the row the question proposes, the question's
#                    file under .stack/questions, and the milestone whose exit it must be settled by
#   enum_values      Enum.VALUE of a flag or kind a row names, with its row; a mapped enum is mapped whole
#   values           a value only a row's prose names, in those words, with its row
#   rows             per live row: planned, the milestone whose exit brings its first value, or server,
#                    what its store names that server's half holds
#   not_keys         literals that read as a key and are none, each with what it is
#
# An area may keep the fields it adds in a testdata/**/metadata_rows.yml, which testdata/gkm's shows: one
# line a field, Message.field: {number, type, row, sees} or {number, type, row, pending, until}. sees
# quotes the row, so a row that stops saying it fails; pending says why the row does not name the
# field yet; number and type are optional pins. A field sits in one file only, and a message a line
# names is a root, whole.

landed: M0
pending_until: M2

key_sources:
  - host_*.go
  - evs_repo_place.go

