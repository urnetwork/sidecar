# The protocol/socket.proto fields no design fence prints, for I-18: SocketRegistrationClaim, §9.5's Claim, which a
# listener signs with its identity key, sockets verifies at registration and keeps with the lease, and Find hands
# each dialer beside its ticket (§9.6). Each line pins the field's number and type and names the §2.8 row that shows
# it; `sees` quotes that row, so a row that stops saying it fails. SocketHint, SocketTicket and SignedSocketTicket are
# §9.5's and §9.6's fences, so their fields are testdata/metadata/fields.yml's.

SocketRegistrationClaim.network_id: {number: 1, type: bytes, row: sock-1, sees: "network_id"}
SocketRegistrationClaim.name: {number: 2, type: string, row: sock-1, sees: "for tls/, smtp/ and ur/, in plaintext"}
SocketRegistrationClaim.name_token: {number: 3, type: bytes, row: sock-1, sees: "the name as a token path"}
SocketRegistrationClaim.listen_id: {number: 4, type: bytes, row: sock-1, sees: "listen_id"}
SocketRegistrationClaim.protocol: {number: 5, type: string, row: sock-1, sees: "protocol"}
SocketRegistrationClaim.app_mode: {number: 6, type: string, row: sock-1, sees: "application mode (http or raw"}
