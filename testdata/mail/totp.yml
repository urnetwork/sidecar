# RFC 6238 Appendix B's TOTP vectors and RFC 4226 Appendix D's HOTP vectors, the latter as TOTP at a 1 s period, so
# a time of t seconds is counter t. mail_totp_test.go holds MailTotpCode to them on every leg the root's tests run on,
# the sidecar_http Worker included, which is why the file is embedded and kept to this flat shape: the root links no
# YAML parser, so the test reads it line by line and stops on any other line.
#
# Each secret is its RFC's ASCII seed in hex: "12345678901234567890" for SHA-1, the 32 bytes
# "12345678901234567890123456789012" for SHA-256 and the 64 bytes "1234...1234" for SHA-512, as RFC 6238's reference
# code and its erratum have them. time and valid_until are seconds since the epoch, valid_until the end of time's
# period. Each code is the RFC's published value, reproduced by Python's hmac before it was written here, apart from
# the code under test.

vectors:
