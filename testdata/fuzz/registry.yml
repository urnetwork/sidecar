# §22.6's fuzz targets (D-TEST-4, R-TEST-5; TEST-M1-10): every func Fuzz in this repository, by the bullet of
# §22.6 it answers, with its owning task, its seeds and, where the bullet names one, the second implementation it is
# held to. check/fuzz_registry_test.go holds this file to the code and to §22.6's own text:
#
#   - a func Fuzz with no target here fails, and so does a target here past its milestone with no func Fuzz;
#   - a target with no seeds fails: none named here, no f.Add in it or in a helper it hands f to, and no corpus
#     in its package's testdata/fuzz/<target>/; a seeds directory named here must hold a file, and a package's
#     own corpus directory must be named here;
#   - a crasher a person moved in with sidecartest.CrasherSeed names its regression test, which must exist;
#   - every bullet of §22.6 has one row, matched by its bold words, and a row's bullet must be one of them;
#   - a second implementation named here is imported by a test file of the target's package, and a reference
#     named here is a function its tests declare;
#   - each target's seeds run as ordinary tests under test.sh: TestFuzzSeedsRunUnderTestSh runs every module's
#     targets as test.sh does, with and without sidecar_testhooks, and fails a target no seed of which ran
#     (owner decision 101: fuzzing runs nowhere continuously, so a seed that never runs is the whole risk).
#
# landed       the newest milestone whose exit has passed, which each gate's sweep raises with
#              testdata/metadata/fields.yml's, and the two must agree
# rows         one per §22.6 bullet, then the targets other sections and tasks asked for
#   id         a short name for findings
#   bullet     §22.6's bold words, without the colon; empty on a row no bullet names
#   spec       for a row no bullet names, what asks for it
#   owner      the task that writes the row's targets, unless a target names its own
#   milestone  Mn: from that milestone's exit, a target here with no func Fuzz fails
#   differential  the second implementation or reference §22.6's bullet names, if any: once the row's
#              milestone has landed, at least one of its targets names a second or a reference
#   targets
#     name     the func Fuzz
#     package  its package as check/ names it: "." for the root, else its directory, a nested module's
#              name first (mlsinterop, smtpproof)
#     owner, milestone  when they differ from the row's
#     seeds    directories, relative to the package, whose files the target adds as seeds or go test reads
#              as its corpus; empty when its seeds are f.Add calls in code
#     second   import paths of the second implementation the target compares against
#     reference  a function of the package's tests, written apart, that the target compares against
#
# Third-party forks under third_party/ keep their upstream fuzz targets, which are not ours and are not listed.
# Server's targets (FuzzSidecarConfig, OPS-M1-03) sit in server's tests, which this repository cannot read.

