# §22.9's conformance ledger (D-TEST-7: "conformance peers are pinned and rerun per pin change";
# R-TEST-7; TEST-M2-17). One entry per §22.9 row, each listing that row's peers with the version each is
# pinned at, the task and test that run them, and every run recorded. check/conformance_test.go's
# TestConformanceLedger reads this file against design/source/sections/22-TEST.md.
#
# rows        one per bold row of §22.9, in its order.
#   row       the row's bold name, as §22.9 writes it.
#   design    the row's parenthesized peer list, verbatim. A change to §22.9's list fails the check
#             until someone reads it and updates peers here, so a peer the design adds cannot go unseen.
#   owners    the tasks whose tests run the row's peers.
#   milestone the gate the row first counts at.
#   tests     the owning tests' names, once their tasks land them; empty means no test runs the row yet,
#             which a gate reads as missing.
#   peers     each peer the design names, as one or more entries.
#     peer      what the peer is.
#     pin       the version it is pinned at: a version, never "latest". Empty with unpinned set means no
#               owner has pinned it yet, which reads open.
#     latest    the design asks for the newest release (§22.9's "latest"): the peer is pinned at each run,
#               which records what it got, and no pin is set here.
#     source    where the pin comes from.
#     unpinned  why there is no pin yet, and who sets one.
#     runs      each run, newest last.
#       at      the day, yyyy-mm-dd.
#       host    where it ran: a host this repository names, never an address.
#       pin     the pin it ran at; a latest peer's run records got instead.
#       got     what a latest peer resolved to on that run, a version.
#       result  pass, fail or open. open means this host lacks the peer, which is never a pass.
#       test    the test that ran it.
#       commit  the sidecar commit it ran on.
#
# The check fails on a §22.9 row with no entry, on an entry §22.9 does not hold, on a design text that
# no longer matches, and on a pin that changed with no run recorded at it since. A peer never run, or
# unpinned, reads open in its report: open is never pass.

