        source: "§22.9's 2.34, Ubuntu 22.04's: jammy's git package is upstream 2.34.1"
        runs: []
      - peer: git, as Ubuntu 24.04 and Claude Code cloud ship it
        pin: "2.43.0"
        source: "§22.9's 2.43, Ubuntu 24.04's: noble's git package is upstream 2.43.0"
