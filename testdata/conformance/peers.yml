    milestone: M12a
    tests: [TestConformanceReplaysCodexCurrent, TestConformanceReplaysCodexPrevious, TestConformanceLiveCodex]
    peers:
      - peer: Codex, the current release
        pin: "0.171.0"
        source: "openai/codex rust-v0.171.0, the latest stable release on 2026-11-23 (research_notes/Brave web search tool/hosted_search_in_harnesses.md); its transcripts are sidecartest/conformance/testdata/codex/0.171.0"
        runs: []
      - peer: Codex, the previous release
        pin: "0.168.0"
        source: "openai/codex rust-v0.168.0 (2026-11-13), the newest earlier release the research names (hosted_search_in_harnesses.md's #59033); its transcripts are sidecartest/conformance/testdata/codex/0.168.0"
        runs: []
      - peer: Claude Code
        unpinned: "CTEST-M13-05 pins the Claude Code release its Messages transcripts are written from (2.1.330 was read for the design on 2026-11-23)"
        runs: []
      - peer: Open Responses' conformance suite
        unpinned: "External: the compute rota runs the published suite against the gateway per release (§14.10) and pins the revision it ran"
        runs: []
      - peer: OpenCode, a smoke run under ur gateway run
