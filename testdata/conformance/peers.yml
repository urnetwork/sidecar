# DESIGN-COMPUTE.md §18's pinned peers (CTEST-M12-03; D-TEST-7 as §18 extends §22's gates): one entry per §18 row that
# names a peer, with the same fields as §22.9's rows but for design, which quotes the row's own words for its peers,
# each verbatim, so a change to them fails the check until someone reads it and updates the peers here. A milestone
# is DESIGN-COMPUTE's M11 to M16, a part letter allowed. A transcript replay of a pinned release is no run of that
# release: only a run of the peer itself is recorded, so a peer whose live run has not happened reads open.
compute:
  - row: The gateway
    design:
      - "Codex at the current and previous releases and Claude Code's, end to end"
      - "Open Responses' conformance suite"
      - "OpenCode and Aider smoke"
