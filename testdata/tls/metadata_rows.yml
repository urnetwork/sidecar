# The protocol/tls.proto fields no design fence prints, for I-18: plan-TLS-small-readings#1's TlsHint, which certs
# builds into PushHint.hint on topic tls, and #2's TlsKeyAttestation, which certs decodes to check an order. Each line
# pins the field's number and type and names the §2.8 row that shows it; `sees` quotes that row, so a row that stops
# saying it fails. TlsEdgeOpen is §13.5's fence, so its fields are testdata/metadata/fields.yml's.

TlsHint.kind: {number: 1, type: TlsHintKind, row: connect-4, sees: "server-held ids, kinds and versions"}
TlsHint.cert_id: {number: 2, type: bytes, row: connect-4, sees: "server-held ids, kinds and versions"}

TlsKeyAttestation.network_id: {number: 1, type: bytes, row: cert-1, sees: "network_id"}
TlsKeyAttestation.sidecar_id: {number: 2, type: bytes, row: cert-1, sees: "sidecar_id"}
TlsKeyAttestation.spki_sha256: {number: 3, type: bytes, row: cert-1, sees: "SPKI hash"}
TlsKeyAttestation.identifier_set_sha256: {number: 4, type: bytes, row: cert-1, sees: "identifier-set hash"}
TlsKeyAttestation.issue_time_millis: {number: 5, type: uint64, row: cert-1, sees: "the identity-key attestation"}
