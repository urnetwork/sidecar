CoreHint.sidecar_id: {number: 2, type: bytes, row: connect-4, sees: "server-held ids, kinds and versions"}
CoreHint.min_secure_version: {number: 3, type: uint32, row: connect-4, sees: "server-held ids, kinds and versions"}
