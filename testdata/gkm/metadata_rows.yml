# Every field of protocol/gkm.proto, for I-18: its number and type, which pin the messages no design fence pins, and
# the §2.8 row that shows it. `sees` quotes that row, so a row that stops saying it fails. A field a row does not yet
# name says so under `pending`, with what §10 requires it for: those wait on a design-records edit of the row, never
# on the field, and each stays visible here until the row names it.

GkmCommitHeader.generation: {number: 1, type: uint64, row: gkm-2, sees: "generation"}
GkmCommitHeader.auth: {number: 2, type: AuthPin, row: gkm-2, sees: "auth pin"}

UrMlsCredential.sidecar_id: {number: 1, type: bytes, row: gkm-4, sees: "credential: sidecar_id"}
UrMlsCredential.identity_public_key: {number: 2, type: bytes, row: gkm-4, sees: "identity key"}
UrMlsCredential.identity_alg: {number: 3, type: string, row: gkm-4, pending: "10.4's field; api-5 already shows a sidecar's algorithm, gkm-4 does not name it"}
UrMlsCredential.mls_signature_public_key: {number: 4, type: bytes, row: gkm-4, sees: "signature key"}
UrMlsCredential.cipher_suite: {number: 5, type: uint32, row: gkm-4, sees: "suite"}
UrMlsCredential.not_after: {number: 6, type: int64, row: gkm-4, sees: "not_after"}
UrMlsCredential.admission_sha256: {number: 7, type: bytes, row: gkm-4, sees: "admission hash"}
UrMlsCredential.identity_signature: {number: 8, type: bytes, row: gkm-4, sees: "signature)"}

