# Every field of §7.9's records a server reads, for I-18: its number and type, which pin the messages no design fence
# pins, config.proto's all among them, ahead of their freeze at M2, and the words of api-7 that show it. A row that stops
# saying them fails, and so does a number that moves. Genesis and two ProjectionHeader fields stay in fields.yml's open
# section, as question metadata-list-unnamed-fields asks for their words. What a seal or a config head holds stays out:
# fields.yml's seals and sealed_messages say so, and a message named here would be a root.

