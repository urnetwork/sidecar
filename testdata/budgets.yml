# §22.5's hot-path gates and §22.9's platform budgets as one ledger (D-TEST-3; TEST-M1-09): what each gate
# allows, what measures it, and who owns it. D-TEST-3: "22.5's gates and 22.9's budgets fail the build;
# raising one needs a reviewed change". check/'s budgets rule fails a limit raised above the value the
# sidecar branch holds unless the same change rewrites the row's reviewed line, as
# sdk/build/APPLE_EXTENSION_MEMORY_BUDGET.md records each raise of its own ceilings.
#
# budgets      one row per gate
#   id         stable: lower case words joined by hyphens
#   spec       where the design sets the number
#   kind       bench   a Go benchmark, read from go test -bench -benchmem by sidecartest.CheckBudget
#              path    an inline server path, run through server's sidecart3.InlinePath, which arms
#                      DenyPostgresForTest over it and counts its Redis calls with
#                      sidecarhost.CountingRedis
#              size    bytes of a built artifact, which make size holds (check/size_gate_test.go)
#              memory  a host's memory budget, measured on T4's cells and on T5, never on a merge
#   owner      the task whose code the row holds
#   module     where its measure lives: sidecar or server
#   package    the measure's package, from the module's root: "." for the root, empty where the owner
#              has not placed it yet, when a path's name is looked for in the whole module
#   name       the benchmark, the InlinePath name or the size gate's test. A name its package does not
#              declare yet reads missing, never a pass, until its owner lands it
#   settings   what the measure runs on: effective constructor settings with features on (R-TEST-2)
#   limits     bench: ns_per_op, allocs_per_op, bytes_per_op; path: postgres, redis_calls; size and
#              memory: bytes. An absent limit is one the owner has not set, which reads missing. Time
#              (ns_per_op) is held at the t5 gate alone, on a quiet T5 host: a shared machine's clock
#              says nothing, so a merge reads allocations, bytes and operation counts
#   reviewed   who reviewed the last raise, when, and why; empty while a row holds the design's number
#   note       anything a reader needs that the fields do not say
#
# A raise is a reviewed change; a cut is not. Never loosen a row to make a failing run pass: the run is
# the finding (connect/CODESTYLE.md:175).

